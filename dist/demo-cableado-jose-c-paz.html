<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Ocupación de Cableado · Demo</title>
  <!-- Librerías gratuitas por CDN: Leaflet (mapa OSM) y Chart.js (gráficos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
/* =========================================================
   Control de Ocupación de Cableado · estilos de la demo
   Paleta sobria institucional + semáforo de estados
   ========================================================= */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #17212e;
  --ink-2: #3c4757;
  --muted: #5d6877;
  --line: #e1e5eb;
  --line-2: #eceff3;
  --brand: #1d3f66;
  --brand-2: #2a78d6;
  --brand-soft: #e8f1fc;
  --side: #13233a;
  --side-2: #1b304d;
  --accent: #0f7b6c;
  /* Semáforo (colores de estado reservados) */
  --ok: #0ca30c;      --ok-ink: #0a6e0a;   --ok-soft: #e7f6e7;
  --warn: #fab219;    --warn-ink: #8a5a00; --warn-soft: #fff4dc;
  --crit: #d03b3b;    --crit-ink: #a92828; --crit-soft: #fdeaea;
  --none: #8f96a0;    --none-soft: #eef0f3;
  --info-soft: #e8f1fc; --info-ink: #1c5cab;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 40px rgba(16, 24, 40, .22);
  --side-w: 248px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--brand-2); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 1.55rem; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; font-weight: 650; }
h3 { font-size: 1.02rem; font-weight: 650; display: flex; align-items: center; gap: 8px; }
p { margin: .4em 0; }
code { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .86em; background: var(--surface-2); border: 1px solid var(--line-2); padding: 1px 5px; border-radius: 4px; }
.ico { flex: none; vertical-align: -3px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.mt { margin-top: 14px; } .mt-s { margin-top: 8px; }
.t-crit { color: var(--crit-ink); } .t-warn { color: var(--warn-ink); } .t-ok { color: var(--ok-ink); }
.strong { font-weight: 700; }

/* ---------- Layout ---------- */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: var(--side-w); flex: none; background: var(--side); color: #c9d4e3;
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 40;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
.brand-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--brand-2); color: #fff; display: grid; place-items: center; }
.brand-title { color: #fff; font-weight: 650; font-size: 1rem; }
.brand-sub { font-size: .76rem; color: #92a3ba; }
#nav { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
#nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #c9d4e3; font-size: .92rem; }
#nav a:hover { background: var(--side-2); color: #fff; text-decoration: none; }
#nav a.active { background: var(--brand-2); color: #fff; }
.nav-badge { margin-left: auto; background: var(--crit); color: #fff; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
.nav-badge.warn { background: var(--warn); color: #3b2a00; }
.sidebar-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.07); }
.foot-note { font-size: .74rem; color: #7f90a8; margin-top: 8px; text-align: center; }
#sidebar-scrim { display: none; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: 0; z-index: 30; height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 22px; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.topbar-title { font-weight: 600; color: var(--ink-2); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.role-select { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.role-select select { padding: 6px 8px; }
.user-chip { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-2); max-width: 260px; }
.user-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#view { padding: 22px; max-width: 1480px; width: 100%; margin: 0 auto; outline: none; }
#view > * + * { margin-top: 16px; }
.only-mobile { display: none; }

/* ---------- Componentes base ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 16px; }
.col > .card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head p { max-width: 860px; }
.head-actions { display: flex; gap: 8px; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.section-title { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 16px 0 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2 > .card + .card { margin-top: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 550; cursor: pointer;
  white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); border-color: #cdd3dc; text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #163252; border-color: #163252; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: #0b6357; border-color: #0b6357; }
.btn-danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn-danger:hover { background: #b33030; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost-dark { background: transparent; border: 1px solid rgba(255,255,255,.18); color: #c9d4e3; width: 100%; }
.btn-ghost-dark:hover { background: var(--side-2); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: .85rem; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 7px; color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }

select, input, textarea { max-width: 100%; font: inherit; color: var(--ink); border: 1px solid #cfd5de; border-radius: 7px; padding: 7px 9px; background: #fff; min-width: 0; }
select:focus, input:focus, textarea:focus, .btn:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 1px; }
input[type=range] { padding: 0; border: 0; width: 100%; accent-color: var(--brand-2); }
.field { min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); font-weight: 550; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline > select { flex: 1; min-width: 0; }
.field > input, .field > select, .field > textarea { color: var(--ink); font-weight: 400; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.form-row .field { flex: 1; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .76rem; font-weight: 650;
  border: 1px solid transparent; white-space: nowrap; line-height: 1.5;
}
.b-ok { background: var(--ok-soft); color: var(--ok-ink); border-color: #bfe5bf; }
.b-warn { background: var(--warn-soft); color: var(--warn-ink); border-color: #f6d999; }
.b-crit { background: var(--crit-soft); color: var(--crit-ink); border-color: #f2c1c1; }
.b-none { background: var(--none-soft); color: #4d5562; border-color: #dde1e6; }
.b-info { background: var(--info-soft); color: var(--info-ink); border-color: #c9ddf5; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.dot.big { width: 16px; height: 16px; margin: 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.sw-line { display: inline-block; width: 22px; height: 0; border-top: 4px solid #3a4656; vertical-align: 3px; margin-right: 6px; }
.sw-line.dashed { border-top-style: dashed; }

.callout { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; font-size: .9rem; border: 1px solid; }
.callout .ico { margin-top: 2px; }
.callout.ok { background: var(--ok-soft); border-color: #bfe5bf; color: #0d4f0d; }
.callout.warn { background: var(--warn-soft); border-color: #f6d999; color: #6b4600; }
.callout.crit { background: var(--crit-soft); border-color: #f2c1c1; color: #8a1f1f; }
.callout.info { background: var(--info-soft); border-color: #c9ddf5; color: #17497f; }
.callout.banner { margin-top: 0; }

/* ---------- Tablas ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }
.table tr.row-sel td { background: var(--brand-soft); }
.table tr.row-warn td { background: #fffaf0; }
.table tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.table.mini { font-size: .85rem; }
.table.mini td, .table.mini th { padding: 6px 8px; }
.table.matrix td.col-sel, .table.matrix th.col-sel { background: var(--brand-soft); }
.rank { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-size: .72rem; font-weight: 700; margin-right: 8px; color: var(--ink-2); }

.meter { display: inline-block; width: 90px; height: 7px; background: var(--line-2); border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.meter-fill { height: 100%; border-radius: 4px; }
.m-ok { background: var(--ok); } .m-warn { background: var(--warn); } .m-crit { background: var(--crit); }
.delta { font-size: .8rem; font-weight: 650; padding: 1px 6px; border-radius: 6px; background: var(--none-soft); color: #4d5562; }
.delta.up { background: var(--ok-soft); color: var(--ok-ink); }
.delta.down { background: var(--crit-soft); color: var(--crit-ink); }

/* ---------- Dashboard ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; padding: 22px 24px; border-left: 4px solid var(--crit); }
.hero h2 { font-size: 1.55rem; font-weight: 600; margin: 6px 0 8px; letter-spacing: -.01em; }
.hero h2 strong { font-weight: 750; }
.hero p { color: var(--ink-2); }
.hbar { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; margin-bottom: 12px; font-size: .88rem; }
.hbar-label { color: var(--muted); }
.hbar-track { height: 22px; background: var(--line-2); border-radius: 5px; display: flex; gap: 2px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 4px; }
.fill-brand { background: var(--brand-2); }
.fill-crit { background: var(--crit); }
.hbar-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.hbar-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.hbar-legend .sw { vertical-align: -1px; }
.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi-grid.kpi-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi-grid > .card + .card { margin-top: 0; }
.kpi { padding: 14px 16px; }
.kpi-label { font-size: .8rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 1.65rem; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-sub { font-size: .8rem; color: var(--muted); }
.kpi-sub + .kpi-sub { margin-top: 3px; }
.kpi-alert { border-color: #f2c1c1; }
.stack-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 0 14px; }
.stack-bar .seg { display: block; height: 100%; }
.stack-bar .seg:hover { filter: brightness(1.08); }
.estado-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.estado-list.compact { grid-template-columns: 1fr 1fr; margin-top: 12px; }
.estado-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; color: inherit; flex-wrap: wrap; }
a.estado-item:hover { background: var(--surface-2); text-decoration: none; }
.estado-num { font-weight: 750; font-size: 1.1rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.chart-box { position: relative; height: 240px; }

/* ---------- Mapa ---------- */
.filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; padding: 12px 16px; }
.filters .field.grow { min-width: 200px; }
.filter-count { margin-left: auto; font-size: .85rem; color: var(--muted); padding-bottom: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: .82rem; cursor: pointer; color: var(--muted); opacity: .6; }
.chip.on { opacity: 1; color: var(--ink); border-color: #c4cbd5; background: var(--surface-2); }
.chip .sw { width: 10px; height: 10px; }
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
.map-layout > .card + .card { margin-top: 0; }
.map-wrap { padding: 0; overflow: hidden; position: relative; }
#map, #plan-map { height: calc(100vh - 290px); min-height: 460px; width: 100%; z-index: 1; }
.map-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 9px 14px; font-size: .8rem; color: var(--ink-2); border-top: 1px solid var(--line); background: #fff; }
.map-detail { max-height: calc(100vh - 230px); overflow-y: auto; position: sticky; top: 76px; }
.detail-head { display: flex; justify-content: space-between; gap: 10px; }
.detail-head h3 { font-size: 1.1rem; margin-top: 2px; }
.detail-empty { text-align: center; padding: 16px 4px; color: var(--muted); }
.detail-empty h3 { justify-content: center; color: var(--ink); margin: 8px 0 4px; }
.compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.compare > div { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; text-align: center; }
.compare span { display: block; font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.compare b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.compare.small-c b { font-size: 1.3rem; }
.photo { margin: 12px 0 0; }
.photo img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.photo figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.photo-empty { aspect-ratio: 16 / 10; border: 1px dashed #c6ccd5; border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 6px; color: var(--muted); background: var(--surface-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.exp-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.exp-list li { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .88rem; }
.zone-label { background: rgba(255,255,255,.92); border: 1px solid #c4cbd5; border-radius: 6px; padding: 3px 8px; font-size: 12px; text-align: center; white-space: nowrap; width: auto !important; height: auto !important; box-shadow: var(--shadow); transform: translate(-50%, -50%); }

/* ---------- Relevamiento ---------- */
.rel-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.step-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: .75rem; }
.stage { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: #0f1b2d; margin-top: 12px; }
.stage-media, .stage-media > svg, .stage-media > img, .stage-media > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.stage-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.det-box rect { fill: rgba(42, 214, 120, .12); stroke: #22e07a; stroke-width: 2; }
.det-box text { fill: #fff; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #0b3d22; stroke-width: 3px; font-family: Consolas, monospace; }
.det-box { animation: pop .25s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(1.25); } to { opacity: 1; transform: scale(1); } }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 6px; color: #b6c2d3; text-align: center; padding: 20px; background: repeating-linear-gradient(45deg, #13233a, #13233a 12px, #162a45 12px, #162a45 24px); }
.scanline { position: absolute; left: 0; right: 0; height: 3px; background: #22e07a; box-shadow: 0 0 18px 6px rgba(34, 224, 122, .45); animation: scan 1.6s linear infinite; top: 0; }
@keyframes scan { from { top: 0; } to { top: 100%; } }
.stage-status { position: absolute; left: 12px; top: 12px; background: rgba(10, 20, 35, .78); color: #d6f7e5; padding: 5px 10px; border-radius: 6px; font-size: .8rem; font-family: Consolas, monospace; }
.stage-count { position: absolute; right: 12px; top: 12px; background: #22e07a; color: #06281a; font-weight: 800; padding: 6px 12px; border-radius: 8px; font-size: 1.1rem; box-shadow: var(--shadow-lg); }
.stage-gps { position: absolute; left: 10px; bottom: 10px; background: rgba(10, 20, 35, .72); color: #fff; padding: 4px 9px; border-radius: 6px; font-size: .76rem; font-family: Consolas, monospace; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--ink-2); margin-top: 10px; }
.big-count { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.big-count > div { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; text-align: center; }
.big-count span { display: block; font-size: .75rem; color: var(--muted); }
.big-count b { font-size: 2rem; font-variant-numeric: tabular-nums; }
.conf { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; font-size: .9rem; }
.conf .meter { flex: 1; height: 9px; }
.progress { height: 6px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.progress-bar.indeterminate { width: 35%; height: 100%; background: var(--brand-2); animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { margin-left: -35%; } to { margin-left: 100%; } }
.stepper-input { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.stepper-input input { width: 90px; font-size: 1.5rem; font-weight: 700; text-align: center; padding: 6px; }
.stepper-input .icon-btn { border: 1px solid var(--line); width: 40px; height: 40px; }
.stepper-input.disabled { opacity: .55; }

/* ---------- Identificación ---------- */
.qr-mini { display: inline-block; vertical-align: middle; margin-right: 6px; line-height: 0; }
.inline-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.inline-actions select { padding: 4px 6px; font-size: .85rem; }
.scan-box { text-align: center; }
.scan-qr { position: relative; display: inline-block; padding: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; line-height: 0; margin-bottom: 10px; }
.scan-box .kv { text-align: left; margin: 8px 0; }

/* ---------- Cobro ---------- */
.cobro-layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.slider-row { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.slider-row:last-of-type { border-bottom: 0; margin-bottom: 8px; }
.slider-top { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; margin-bottom: 4px; }
.slider-top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.scenario-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.scenario-grid > .card + .card { margin-top: 0; }
.calc-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.calc-grid .kv dd { text-align: left; }
.table.calc .formula { color: var(--muted); font-size: .82rem; font-family: Consolas, monospace; }
.calc-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.mini-stat { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; }
.mini-stat span { font-size: .78rem; color: var(--muted); }
.mini-stat b { font-size: 1.15rem; }
.mini-stat small { color: var(--muted); }

/* ---------- Expedientes ---------- */
.amnistia { display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; border-left: 4px solid var(--none); }
.amnistia.on { border-left-color: var(--ok); }
.amnistia > div:first-child { flex: 1; min-width: 260px; }
.amn-ctrl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.switch input { display: none; }
.switch span { width: 40px; height: 22px; border-radius: 12px; background: #c6ccd5; position: relative; transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { left: 21px; }
.pipeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.pipe { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; text-align: left; font: inherit; display: flex; flex-direction: column; gap: 2px; position: relative; }
.pipe:hover { border-color: #b9c2ce; }
.pipe.on { border-color: var(--brand-2); background: var(--brand-soft); }
.pipe-n { font-size: 1.4rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.pipe-l { font-size: .78rem; color: var(--muted); }
.stepper { list-style: none; padding: 0; margin: 14px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.stepper li { position: relative; text-align: center; font-size: .74rem; color: var(--muted); padding: 0 2px; }
.stepper li::before { content: ""; position: absolute; top: 12px; left: -50%; right: 50%; height: 2px; background: var(--line); z-index: 0; }
.stepper li:first-child::before { display: none; }
.st-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 50%; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: .75rem; }
.stepper li.done { color: var(--ink-2); }
.stepper li.done .st-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.stepper li.done::before, .stepper li.current::before { background: var(--ok); }
.stepper li.current { color: var(--ink); font-weight: 700; }
.stepper li.current .st-dot { border-color: var(--brand-2); background: var(--brand-2); color: #fff; box-shadow: 0 0 0 4px var(--brand-soft); }
.stepper li.skipped .st-dot { border-style: dashed; color: #b1b7c0; }
.exp-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.exp-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.exp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; margin-top: 8px; }
.timeline { list-style: none; padding: 0; margin: 0; font-size: .85rem; border-left: 2px solid var(--line); }
.timeline li { padding: 0 0 10px 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand-2); border: 2px solid #fff; }
.tl-date { display: block; color: var(--muted); font-size: .76rem; }
.tl-user { display: block; color: var(--muted); font-size: .76rem; }

/* ---------- Documento (intimación / boleta) ---------- */
.doc { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px; padding: 26px 30px; font-family: Georgia, "Times New Roman", serif; font-size: .95rem; line-height: 1.55; }
.doc-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #111; margin-bottom: 14px; font-family: inherit; }
.doc-escudo { width: 52px; height: 52px; border: 2px solid #111; border-radius: 50%; display: grid; place-items: center; }
.doc-num { text-align: right; font-size: .85rem; }
.doc-ev { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: center; margin: 12px 0; font-family: "Segoe UI", system-ui, sans-serif; }
.doc-ev img { width: 100%; border-radius: 4px; border: 1px solid #ccc; }
.doc-note { background: #f3f8f3; border: 1px solid #cfe5cf; padding: 8px 12px; border-radius: 4px; font-size: .88rem; }
.doc-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 22px; gap: 16px; }
.doc-qr { display: flex; gap: 8px; align-items: center; }
.doc-firma { text-align: center; border-top: 1px solid #111; padding-top: 6px; min-width: 240px; }
.boleta .kv { margin: 10px 0; font-family: "Segoe UI", system-ui, sans-serif; }
.barcode { text-align: center; margin: 14px 0 6px; }
.barcode svg { max-width: 100%; height: auto; }
.barcode code { display: block; margin-top: 4px; border: 0; background: none; letter-spacing: .08em; }

/* ---------- Portal ---------- */
.portal-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.portal-brand { display: flex; gap: 14px; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; font: inherit; padding: 10px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 550; }
.tab.on { color: var(--brand); border-bottom-color: var(--brand); }
.tab:hover { color: var(--ink); }
#portal-body > * + * { margin-top: 16px; }
.todo { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: flex; gap: 8px; align-items: flex-start; }
.todo li .ico { margin-top: 2px; color: var(--brand-2); }
.dj-input { width: 90px; text-align: center; font-weight: 700; }
.dj-input.flash { animation: flash 1.2s ease-out 2; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(42, 120, 214, .6); background: #e8f1fc; } 100% { box-shadow: 0 0 0 10px rgba(42, 120, 214, 0); } }
.login-wrap { display: grid; place-items: center; min-height: 70vh; }
.login { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; padding: 28px; }
.login h1 { font-size: 1.35rem; }
.login-logo { width: 54px; height: 54px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }

/* ---------- Auditoría ---------- */
.integrity { display: flex; gap: 16px; align-items: flex-start; }
.int-icon { width: 54px; height: 54px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.integrity.good .int-icon { background: var(--ok-soft); color: var(--ok-ink); }
.integrity.bad .int-icon { background: var(--crit-soft); color: var(--crit-ink); }
.integrity code { word-break: break-all; }
.filters-inline { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Planificación ---------- */
.plan-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
.plan-layout > .card + .card { margin-top: 0; }
#plan-map { height: 460px; min-height: 0; }

/* ---------- Modales y toasts ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(12, 20, 33, .5); z-index: 1000; display: grid; place-items: center; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.modal-sm { max-width: 420px; } .modal-md { max-width: 640px; } .modal-lg { max-width: 980px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
#toast-root { position: fixed; right: 18px; bottom: 18px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.toast { display: flex; gap: 8px; align-items: flex-start; background: #17212e; color: #fff; padding: 10px 14px; border-radius: 9px; box-shadow: var(--shadow-lg); font-size: .9rem; animation: slide .2s; transition: opacity .3s, transform .3s; }
.toast .ico { margin-top: 2px; }
.toast-ok .ico { color: #5be08a; }
.toast-error { background: #7d1f1f; }
.toast.out { opacity: 0; transform: translateY(8px); }
@keyframes slide { from { transform: translateY(10px); opacity: 0; } }

/* ---------- Demo guiada ---------- */
.tour-spot { position: fixed; z-index: 2000; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(10, 18, 30, .5), 0 0 0 3px #fab219; pointer-events: none; transition: all .35s ease; }
.tour-box { position: fixed; z-index: 2100; background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg); padding: 14px 16px; border-top: 4px solid var(--warn); transition: left .35s ease, top .35s ease; }
.tour-top { display: flex; justify-content: space-between; align-items: center; }
.tour-step { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.tour-dots { display: flex; gap: 4px; margin: 6px 0 8px; }
.tour-dots span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.tour-dots span.done { background: var(--ok); }
.tour-dots span.on { background: var(--warn); }
.tour-title { font-size: 1.05rem; margin-bottom: 4px; }
.tour-text { font-size: .93rem; color: var(--ink-2); margin: 0 0 10px; }
.tour-progress { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.tour-progress div { height: 100%; width: 0; background: var(--brand-2); transition: width .1s linear; }
.tour-ctrl { display: flex; gap: 8px; justify-content: flex-end; }
body.touring .modal-backdrop { background: rgba(12, 20, 33, .25); }

/* ---------- Leaflet ajustes ---------- */
.leaflet-container { font: inherit; }
.leaflet-tooltip { font-size: .82rem; }

/* ---------- Impresión (intimación / boleta) ---------- */
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing #print-area { display: block; }
  body.printing .doc { border: 0; padding: 0; }
  @page { margin: 18mm; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .map-layout, .rel-layout, .cobro-layout, .plan-layout { grid-template-columns: minmax(0, 1fr); }
  .map-detail { position: static; max-height: none; }
  .hero { grid-template-columns: 1fr; }
  .calc-grid, .exp-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s; }
  body.nav-open #sidebar { transform: none; }
  body.nav-open #sidebar-scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }
  .only-mobile { display: inline-grid; }
  .grid-2, .kpi-grid.kpi-4, .scenario-grid { grid-template-columns: 1fr; }
  .grid-2 > .card + .card { margin-top: 0; }
  .user-chip, .role-select span, .topbar-title { display: none; }
  #topbar { padding: 0 12px; gap: 8px; }
  #view { padding: 16px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stepper .st-l { display: none; }
  .doc-ev { grid-template-columns: 1fr; }
  #map { height: 60vh; min-height: 360px; }
}
@media (max-width: 560px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hbar { grid-template-columns: 1fr 50px; }
  .hbar-label { grid-column: 1 / -1; }
  .estado-list { grid-template-columns: 1fr; }
  h1 { font-size: 1.3rem; }
  .hero h2 { font-size: 1.25rem; }
  .btn-accent { padding: 7px 10px; }
}

/* Mapa base desaturado: el semáforo de estados resalta sobre las calles */
.leaflet-tile-pane { filter: saturate(.35) brightness(1.04); }

/* =========================================================
   Tablero ejecutivo (v2) y paneles de detalle
   ========================================================= */
.dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 4px; }
.dash-head h1 { font-size: 1.7rem; margin: 4px 0 2px; }
.dash-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live-pill { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

/* Hero */
.hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); background: linear-gradient(135deg, #fff 0%, #fff 60%, #fbf6f6 100%); border-left: 0; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--crit); }
.hero-side { display: flex; flex-direction: column; gap: 14px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hstat { font: inherit; color: inherit; text-align: left; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
.hstat:hover { border-color: #b9c7d8; background: #fff; }
.hstat span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
.hstat b { font-size: 1.6rem; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hstat small { margin-left: 6px; color: var(--crit-ink); font-weight: 700; }
.hero-side .hbar { grid-template-columns: 96px 1fr; margin-bottom: 8px; }

/* Tarjetas KPI clicables */
.kpi-card {
  font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s; min-width: 0;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(16, 24, 40, .09); border-color: #b9c7d8; }
.kpi-card:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi-card .kpi-label { font-size: .8rem; color: var(--muted); font-weight: 650; }
.kpi-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.i-blue { background: var(--info-soft); color: var(--info-ink); }
.i-red { background: var(--crit-soft); color: var(--crit-ink); }
.i-green { background: var(--ok-soft); color: var(--ok-ink); }
.i-amber { background: var(--warn-soft); color: var(--warn-ink); }
.i-slate { background: var(--none-soft); color: #3c4757; }
.kpi-card .kpi-value { font-size: 1.75rem; margin: 2px 0 0; }
.kpi-compare { font-size: .84rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi-card .kpi-sub { font-size: .78rem; }
.kpi-card .spark { width: 100%; height: 30px; margin-top: 2px; }
.kpi-foot { margin-top: auto; padding-top: 9px; border-top: 1px solid var(--line-2); font-size: .8rem; color: var(--brand-2); font-weight: 650; display: flex; align-items: center; gap: 4px; }
.kpi-card:hover .kpi-foot .ico { transform: translateX(3px); }
.kpi-foot .ico { transition: transform .15s; }

/* Fila estado + ranking */
.dash-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; }
.dash-row > .card + .card { margin-top: 0; }
.card-head p { margin: 2px 0 0; }
.stack-bar .seg { border: 0; padding: 0; cursor: pointer; }
.estado-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.estado-card { font: inherit; color: inherit; text-align: left; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 12px 12px 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.estado-card:hover { border-color: #b9c7d8; background: var(--surface-2); }
.estado-card.static { cursor: default; }
.estado-card.static:hover { background: var(--surface); border-color: var(--line); }
.estado-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.estado-lbl { font-size: .85rem; font-weight: 650; display: flex; align-items: center; gap: 5px; }
.estado-card .estado-num { grid-row: span 2; font-size: 1.5rem; }
.table-pro th { background: var(--surface-2); }
.table-pro th:first-child { border-top-left-radius: 8px; }
.table-pro th:last-child { border-top-right-radius: 8px; }
.table-pro tr.clickable td.chev { color: #b0b8c4; width: 24px; }
.table-pro tr.clickable:hover td.chev { color: var(--brand-2); }
.head-figure { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.head-figure b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.mini-stack { display: flex; gap: 2px; width: 120px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); }
.mini-stack i { display: block; height: 100%; }

/* Panel lateral de detalle */
.drawer-backdrop { display: flex; justify-content: flex-end; align-items: stretch; padding: 0; }
.modal.drawer { width: min(680px, 100vw); max-width: none; height: 100vh; max-height: 100vh; border-radius: 14px 0 0 14px; animation: drawerIn .22s ease-out; }
@keyframes drawerIn { from { transform: translateX(48px); opacity: 0; } }
.drawer .modal-head { align-items: flex-start; padding: 18px 20px; background: var(--surface-2); border-radius: 14px 0 0 0; }
.drawer .modal-head h3 { font-size: 1.2rem; margin-top: 2px; }
.drawer .modal-body { padding: 18px 20px; flex: 1; }
.drawer .modal-foot { justify-content: flex-end; }
.d-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.d-stats > div { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 11px; min-width: 0; }
.d-stats span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; }
.d-stats b { font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-section { margin-top: 18px; }
.d-section h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.d-section > p.muted { margin: -2px 0 8px; }
.d-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: .9rem; }
.d-list li { margin-bottom: 4px; }
.etapa-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.etapa-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: .8rem; color: var(--ink-2); }
.etapa-chip b { font-size: .95rem; color: var(--ink); }
.etapa-chip.zero { opacity: .5; }
.doc.informe h3 { margin: 16px 0 6px; font-size: 1rem; }

@media (max-width: 1100px) { .dash-row { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .d-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hstat b { font-size: 1.2rem; }
  .modal.drawer { border-radius: 0; }
}

/* ---------- Analítica y modelos ---------- */
.an-kpis { margin-top: 16px; }
.an-kpi-txt { font-size: 1.2rem; line-height: 1.25; padding: 4px 0 2px; }
.an-sec { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; margin: 28px 0 12px; color: var(--brand); }
.an-sec span { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: #fff; font-size: .9rem; flex: none; }
.an-sel { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 12px; }
.an-sel .field { min-width: 140px; }
.an-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 12px; font-size: .92rem; }
.an-kv dt { color: var(--muted); }
.an-kv dd { margin: 0; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.an-chi { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.an-top { margin-top: 0; }
.an-res { margin-top: 14px; align-items: start; }
.an-res h4 { margin: 0 0 8px; font-size: .95rem; }
.chart-box.short { height: 200px; }
.table tr.an-sig td { background: var(--info-soft); }
.heat-table td.num { text-align: center; min-width: 74px; }
.boxplot { width: 100%; height: auto; display: block; }
.boxplot text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.an-empty { display: grid; place-items: center; text-align: center; gap: 6px; min-height: 200px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); padding: 16px; }
.an-empty p { margin: 0; max-width: 320px; font-size: .9rem; }
@media (max-width: 900px) { .an-chi { grid-template-columns: minmax(0, 1fr); } }
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin: -2px 0 14px; }
.preset-row .btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.doc-demo { margin: -4px 0 12px; padding: 5px 10px; border: 1px dashed #d9a21b; border-radius: 6px; background: #fff8e6; color: #7a5600; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.compare > .pct-ficha { grid-column: 1 / -1; text-align: left; padding: 10px 12px; }
.pct-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pct-top span { margin: 0; }
.pct-ficha .pct-top b { font-size: 1.45rem; white-space: nowrap; }
.pct-ficha.critico .pct-top b { color: var(--crit-ink); }
.pct-ficha.leve .pct-top b { color: var(--warn-ink); }
.pct-ficha.cumple .pct-top b { color: var(--ok-ink); }
.pct-bar { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin: 8px 0 4px; }
.pct-bar i { display: block; height: 100%; border-radius: 5px; background: var(--ok); }
.pct-ficha.leve .pct-bar i { background: var(--warn); }
.pct-ficha.critico .pct-bar i { background: var(--crit); }
.pct-bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); transform: translateX(-1px); }
.pct-scale { position: relative; height: 15px; font-size: .68rem; color: var(--muted); }
.pct-scale span { position: absolute; top: 0; white-space: nowrap; text-transform: none; letter-spacing: 0; font-size: .68rem; }
.pct-scale span:first-child { left: 0; }
.pct-scale span:nth-child(2) { transform: translateX(-50%); }
.pct-scale span:last-child { right: 0; }
.pct-ficha small { display: block; margin-top: 4px; font-size: .78rem; color: var(--ink-2); }

  <script>/* js/util.js */
/*
 * Utilidades generales: formatos (es-AR), fechas, aleatorio con semilla,
 * hash para la cadena de auditoría, íconos, modales, toasts y la
 * "foto" simulada del poste (SVG generado) usada por la visión artificial.
 */
const U = (() => {
  // ---------- Aleatorio determinístico (mulberry32) ----------
  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- Formatos ----------
  const nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
  const money0 = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 });
  const num = (n, d = 0) => new Intl.NumberFormat('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
  const money = n => money0.format(Math.round(n || 0)).replace(/ /g, ' ');
  /** Monto abreviado: $ 12,4 M · $ 1.234 M · $ 850 mil */
  function moneyShort(n) {
    const a = Math.abs(n || 0);
    if (a >= 1e6) return `$ ${num(n / 1e6, a >= 1e8 ? 0 : 1)} M`;
    if (a >= 1e4) return `$ ${num(n / 1e3, 0)} mil`;
    return money(n);
  }
  const pct = (x, d = 0) => `${num((x || 0) * 100, d)} %`;

  // ---------- Fechas (ISO yyyy-mm-dd, sin zona horaria) ----------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = iso => new Date(iso + 'T12:00:00');
  const todayISO = () => toISO(new Date());
  const addDays = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const addMonths = (iso, n) => { const d = parse(iso); d.setMonth(d.getMonth() + n); return toISO(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  function monthsBetween(a, b) {
    const A = parse(a), B = parse(b);
    let m = (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth());
    if (B.getDate() < A.getDate()) m--;
    return Math.max(0, m);
  }
  const fmtDate = iso => { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
  const fmtDateTime = ts => ts ? `${fmtDate(ts.slice(0, 10))} ${ts.slice(11, 16)}` : '—';
  const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const nowLocalISO = () => { const d = new Date(); return `${toISO(d)}T${nowTime()}`; };
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const monthLabel = iso => { const d = parse(iso); return `${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };

  // ---------- Hash encadenado (FNV-1a doble, 64 bits en hex) ----------
  function hash(str) {
    let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 ^= c; h1 = Math.imul(h1, 16777619);
      h2 ^= c; h2 = Math.imul(h2, 2246822519);
      h2 ^= h2 >>> 13;
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  }

  // ---------- HTML ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ICONS = {

    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
    check: '<path d="m5 12 5 5 9-10"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
    file: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/>',
    print: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M7 14h10v7H7z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
    scan: '<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
    logout: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
    pin: '<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    minus: '<path d="M5 12h14"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
  };
  const icon = (name, size = 18) =>
    `<svg class="ico" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

  // ---------- Estados (semáforo) ----------
  const ESTADOS = {
    cumple:  { label: 'Cumple',          color: '#0ca30c', cls: 'ok',   icon: 'check' },
    leve:    { label: 'Exceso leve',     color: '#fab219', cls: 'warn', icon: 'alert' },
    critico: { label: 'Exceso crítico',  color: '#d03b3b', cls: 'crit', icon: 'alert' },
    sin:     { label: 'Sin relevar',     color: '#8f96a0', cls: 'none', icon: 'clock' },
  };
  const badgeEstado = e => `<span class="badge b-${ESTADOS[e].cls}">${icon(ESTADOS[e].icon, 13)}${ESTADOS[e].label}</span>`;

  // ---------- Toasts ----------
  function toast(msg, type = 'info', ms = 3800) {
    const root = document.getElementById('toast-root');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.innerHTML = `${icon(type === 'error' ? 'alert' : 'check', 16)}<span>${msg}</span>`;
    root.appendChild(t);
    setTimeout(() => t.classList.add('out'), ms);
    setTimeout(() => t.remove(), ms + 400);
  }

  // ---------- Modales ----------
  // drawer: true => panel lateral derecho (se usa para los detalles del tablero)
  function modal({ title, subtitle = '', eyebrow = '', body = '', footer = '', size = 'md', drawer = false, onClose } = {}) {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop' + (drawer ? ' drawer-backdrop' : '');
    wrap.innerHTML = `
      <div class="modal ${drawer ? 'drawer' : 'modal-' + size}" role="dialog" aria-modal="true">
        <div class="modal-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h3>${title}</h3>${subtitle ? `<div class="muted small">${subtitle}</div>` : ''}</div><button class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button></div>
        <div class="modal-body"></div>
        <div class="modal-foot"></div>
      </div>`;
    const h = {
      el: wrap,
      body: wrap.querySelector('.modal-body'),
      foot: wrap.querySelector('.modal-foot'),
      setBody(html) { h.body.innerHTML = html; },
      setFoot(html) { h.foot.innerHTML = html; h.foot.style.display = html ? '' : 'none'; },
      close() { if (!wrap.isConnected) return; wrap.remove(); onClose && onClose(); },
    };
    h.setBody(body); h.setFoot(footer);
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) h.close(); });
    wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) h.close(); });
    root.appendChild(wrap);
    return h;
  }
  const closeModals = () => document.querySelectorAll('#modal-root .modal-backdrop').forEach(m => m.remove());

  // ---------- Impresión / PDF de un documento ----------
  function printHTML(html) {
    const area = document.getElementById('print-area');
    area.innerHTML = html;
    document.body.classList.add('printing');
    setTimeout(() => {
      window.print();
      document.body.classList.remove('printing');
    }, 60);
  }

  // ---------- "Foto" simulada de un poste con N cables ----------
  // Devuelve el SVG y los recuadros (bounding boxes) de cada cable,
  // en coordenadas de un lienzo de 640x400.
  function posteSVG(seed, n) {
    const r = rng(seed * 7 + 13);
    const uid = 'sky' + seed + '_' + n + '_' + Math.floor(Math.random() * 1e6);
    const W = 640, H = 400, xL = 104, xR = 536;
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">`;
    s += `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb8de"/><stop offset="1" stop-color="#e6eef5"/></linearGradient></defs>`;
    s += `<rect width="${W}" height="${H}" fill="url(#${uid})"/>`;
    // Edificios de fondo
    let x = -10;
    while (x < W) {
      const w = 55 + r() * 75, h = 90 + r() * 120, g = 168 + Math.floor(r() * 55);
      s += `<rect x="${x.toFixed(0)}" y="${(326 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="rgb(${g},${g - 8},${g - 18})"/>`;
      for (let wy = 326 - h + 14; wy < 310; wy += 26)
        for (let wx = x + 10; wx < x + w - 14; wx += 20)
          s += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="9" height="12" fill="rgba(255,255,255,.38)"/>`;
      x += w + 3;
    }
    s += `<rect y="320" width="${W}" height="12" fill="#bdb9ae"/><rect y="332" width="${W}" height="68" fill="#777b80"/>`;
    s += `<path d="M0 368h${W}" stroke="#e8e2c8" stroke-width="3" stroke-dasharray="30 22"/>`;
    // Postes
    [xL, xR].forEach(px => {
      s += `<rect x="${px - 7}" y="54" width="14" height="272" fill="#6d5b48"/><rect x="${px - 32}" y="74" width="64" height="7" fill="#54463a"/>`;
    });
    // Cables (curvas catenarias aproximadas con Bézier cuadrática)
    const boxes = [];
    const top = 94, span = 168;
    for (let i = 0; i < n; i++) {
      const y1 = top + (i + 0.5) * span / n + (r() - 0.5) * 5;
      const y2 = y1 + (r() - 0.5) * 12;
      const sag = 12 + r() * 20;
      const cy = (y1 + y2) / 2 + 2 * sag;
      const col = ['#1b1b1b', '#2b2b2b', '#3a3a3a', '#111', '#454545'][Math.floor(r() * 5)];
      const w = (1.8 + r() * 1.8).toFixed(1);
      s += `<path d="M${xL + 7},${y1.toFixed(1)} Q320,${cy.toFixed(1)} ${xR - 7},${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none"/>`;
      // Ventana del cable donde el modelo "marca" la detección (alterna izquierda/derecha)
      const [ta, tb] = i % 2 === 0 ? [0.2, 0.4] : [0.6, 0.8];
      const P = t => { const a = (1 - t) ** 2, b = 2 * (1 - t) * t, c = t * t; return [a * (xL + 7) + b * 320 + c * (xR - 7), a * y1 + b * cy + c * y2]; };
      const pts = [ta, (ta + tb) / 2, tb].map(P);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      boxes.push({ x: Math.min(...xs) - 4, y: Math.min(...ys) - 6, w: Math.max(...xs) - Math.min(...xs) + 8, h: Math.max(...ys) - Math.min(...ys) + 12 });
    }
    s += '</svg>';
    return { svg: s, boxes };
  }
  const _photoCache = {};
  function posteDataURI(seed, n) {
    const k = seed + ':' + n;
    if (!_photoCache[k]) _photoCache[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(posteSVG(seed, n).svg);
    return _photoCache[k];
  }

  // ---------- Código QR y código de barras (simulados, decorativos) ----------
  function qrSVG(text, size = 96) {
    const N = 21, h = hash(text) + hash(text + 'x') + hash(text + 'y') + hash(text + 'z');
    let bits = '';
    for (const ch of h) bits += parseInt(ch, 16).toString(2).padStart(4, '0');
    const cell = size / N;
    let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="#fff"/>`;
    const finder = (x, y) => `<rect x="${x * cell}" y="${y * cell}" width="${7 * cell}" height="${7 * cell}" fill="#111"/><rect x="${(x + 1) * cell}" y="${(y + 1) * cell}" width="${5 * cell}" height="${5 * cell}" fill="#fff"/><rect x="${(x + 2) * cell}" y="${(y + 2) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#111"/>`;
    let k = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
      if (inF) continue;
      if (bits[(k++ * 7) % bits.length] === '1' ^ (x * y) % 3 === 0) s += `<rect x="${x * cell}" y="${y * cell}" width="${cell + .3}" height="${cell + .3}" fill="#111"/>`;
    }
    s += finder(0, 0) + finder(14, 0) + finder(0, 14) + '</svg>';
    return s;
  }
  function barcodeSVG(text, w = 320, h = 56) {
    const hx = (hash(text) + hash(text + '1') + hash(text + '2')).split('');
    let x = 6, s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#fff"/>`;
    let i = 0;
    while (x < w - 8) {
      const v = parseInt(hx[i++ % hx.length], 16);
      const bw = 1 + (v % 3);
      if (i % 2) s += `<rect x="${x}" y="4" width="${bw}" height="${h - 8}" fill="#111"/>`;
      x += bw + 1 + ((v >> 2) % 2);
    }
    return s + '</svg>';
  }

  /** Mini gráfico de línea (sparkline) en SVG */
  function sparkline(values, color = '#2a78d6', w = 120, h = 32) {
    const max = Math.max(...values, 1), min = Math.min(...values, 0);
    const pts = values.map((v, i) => [i * w / Math.max(values.length - 1, 1), h - 3 - (v - min) / (max - min || 1) * (h - 6)]);
    const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,${h} ${line} ${w},${h}" fill="${color}" opacity=".1"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  return {
    rng, num, money, moneyShort, pct, todayISO, addDays, addMonths, daysBetween, monthsBetween,
    fmtDate, fmtDateTime, nowTime, nowLocalISO, monthLabel, hash, esc, icon, ESTADOS, badgeEstado,
    toast, modal, closeModals, printHTML, posteSVG, sparkline, posteDataURI, qrSVG, barcodeSVG, sleep, clamp,
  };
})();
