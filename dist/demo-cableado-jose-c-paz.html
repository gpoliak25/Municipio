const MapaView = (() => {
  let root = null, map = null, layer = null, sel = null;
  const filtros = { prov: '', zona: '', q: '', estados: { cumple: true, leve: true, critico: true, sin: true } };

  function destroy() { if (map) { map.remove(); map = null; } }

  function render(el, params = {}) {
    root = el;
    destroy();
    // Los enlaces con filtro (desde el tablero) parten de los filtros limpios
    if (params.estado || params.prov || params.zona) {
      Object.assign(filtros, { prov: params.prov || '', zona: params.zona || '', q: '' });
      Object.keys(filtros.estados).forEach(k => filtros.estados[k] = !params.estado || k === params.estado);
    }
    const C = Store.CFG;

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Mapa de ocupación</h1><p class="muted">Postes (línea continua) y ductos (línea punteada) georreferenciados. Clic en un tramo para ver el detalle.</p></div>
      </div>
      <div class="card filters" id="map-filtros">
        <label class="field"><span>Proveedor</span>
          <select id="f-prov"><option value="">Todos</option>${C.proveedores.map(p => `<option value="${p.id}" ${filtros.prov === p.id ? 'selected' : ''}>${U.esc(p.corto)}</option>`).join('')}</select></label>
        <label class="field"><span>Zona</span>
          <select id="f-zona"><option value="">Todas</option>${C.zonas.map(z => `<option value="${z.id}" ${filtros.zona === z.id ? 'selected' : ''}>${U.esc(z.nombre)}</option>`).join('')}</select></label>
        <div class="field"><span>Estado</span>
          <div class="chips">${Object.entries(U.ESTADOS).map(([k, v]) => `<button class="chip ${filtros.estados[k] ? 'on' : ''}" data-est="${k}"><i class="sw" style="background:${v.color}"></i>${v.label}</button>`).join('')}</div></div>
        <label class="field grow"><span>Buscar</span><input id="f-q" type="search" placeholder="Tramo o calle (ej: T-0042, General Lavalle)" value="${U.esc(filtros.q)}"></label>
        <div class="filter-count" id="f-count"></div>
      </div>
      <div class="map-layout">
        <div class="card map-wrap">
          <div id="map" role="region" aria-label="Mapa de tramos"></div>
          <div class="map-legend">
            ${Object.values(U.ESTADOS).map(v => `<span><i class="sw" style="background:${v.color}"></i>${v.label}</span>`).join('')}
            <span><i class="sw-line"></i>Poste</span><span><i class="sw-line dashed"></i>Ducto</span>
          </div>
        </div>
        <aside class="card map-detail" id="map-detail"></aside>
      </div>`;

    root.querySelector('#f-prov').onchange = e => { filtros.prov = e.target.value; draw(); renderDetail(); };
    root.querySelector('#f-zona').onchange = e => { filtros.zona = e.target.value; draw(); renderDetail(); fitZona(); };
    root.querySelector('#f-q').oninput = e => { filtros.q = e.target.value.trim().toLowerCase(); draw(); renderDetail(); };
    root.querySelectorAll('[data-est]').forEach(b => b.onclick = () => {
      filtros.estados[b.dataset.est] = !filtros.estados[b.dataset.est];
      b.classList.toggle('on'); draw(); renderDetail();
    });

    if (!window.L) { root.querySelector('#map').innerHTML = '<div class="empty">No se pudo cargar la librería de mapas (requiere conexión a internet).</div>'; return; }
    map = L.map('map', { zoomControl: true, preferCanvas: false }).fitBounds(L.latLngBounds(Store.state.tramos.flatMap(t => t.coords)).pad(0.05));
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
    sel = params.tramo || sel;
    draw();
    renderDetail();
    setTimeout(() => { map && map.invalidateSize(); if (params.tramo) focus(params.tramo, false); }, 80);
  }

  function pasa(t) {
    if (filtros.prov && !t.ocupaciones.some(o => o.prov === filtros.prov)) return false;
    if (filtros.zona && t.zona !== filtros.zona) return false;
    if (!filtros.estados[Store.metrics(t).estado]) return false;
    if (filtros.q && !(t.id.toLowerCase().includes(filtros.q) || t.calle.toLowerCase().includes(filtros.q))) return false;
    return true;
  }

  function draw() {
    if (!layer) return;
    layer.clearLayers();
    let n = 0;
    const vis = Store.state.tramos.filter(pasa);
    vis.forEach(t => {
      n++;
      const m = Store.metrics(t), color = U.ESTADOS[m.estado].color, isSel = sel === t.id;
      if (isSel) L.polyline(t.coords, { color: '#0f1b2d', weight: 15, opacity: 0.85, interactive: false }).addTo(layer);
      const pl = L.polyline(t.coords, { color, weight: isSel ? 9 : 6, opacity: 0.95, dashArray: t.tipo === 'ducto' ? '8 7' : null, lineCap: 'round' }).addTo(layer);
      pl.bindTooltip(`<b>${t.id}</b> · ${U.esc(t.calle)} ${t.altura}<br>${m.estado === 'sin' ? 'Sin relevar' : `${m.aut} autorizados / <b>${m.det}</b> detectados`}`, { sticky: true });
      pl.on('click', () => select(t.id));
      if (t.tipo === 'poste') [t.coords[0], t.coords[t.coords.length - 1]].forEach(c => L.circleMarker(c, { radius: 3, color: '#3a4656', weight: 1, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(layer));
    });
    const c = root.querySelector('#f-count');
    if (c) c.innerHTML = `Mostrando <b>${n}</b> de ${Store.state.tramos.length} tramos`;
  }

  function fitZona() {
    if (!map) return;
    const ts = Store.state.tramos.filter(pasa);
    if (!ts.length) return;
    map.fitBounds(L.latLngBounds(ts.flatMap(t => t.coords)).pad(0.1));
  }

  function select(id) { sel = id; draw(); renderDetail(); }

  /** Centra el mapa en un tramo y abre su detalle (usado también por la demo guiada) */
  function focus(id, animate = true) {
    const t = Store.tramo(id);
    if (!t) return;
    // Si los filtros lo ocultan, se limpian
    if (!pasa(t)) { filtros.prov = ''; filtros.zona = ''; filtros.q = ''; Object.keys(filtros.estados).forEach(k => filtros.estados[k] = true); }
    sel = id;
    draw(); renderDetail();
    if (map) {
      const b = L.latLngBounds(t.coords);
      animate ? map.flyTo(b.getCenter(), 18, { duration: 1.6 }) : map.setView(b.getCenter(), 18);
    }
  }

  function renderDetail() {
    const box = root && root.querySelector('#map-detail');
    if (!box) return;
    if (!sel) {
      const vis = Store.state.tramos.filter(pasa);
      const cnt = { cumple: 0, leve: 0, critico: 0, sin: 0 };
      vis.forEach(t => cnt[Store.metrics(t).estado]++);
      box.innerHTML = `
        <div class="detail-empty">
          ${U.icon('pin', 28)}
          <h3>Seleccione un tramo</h3>
          <p class="muted">Haga clic sobre una línea del mapa para ver cables autorizados vs. detectados, foto del relevamiento, cargos y expediente.</p>
          <div class="estado-list compact">${Object.keys(cnt).map(e => `<div class="estado-item">${U.badgeEstado(e)}<span class="estado-num">${cnt[e]}</span></div>`).join('')}</div>
          <button class="btn btn-sm mt" data-go="${Store.CFG.casoDestacado.tramoId}">Ver caso testigo ${Store.CFG.casoDestacado.tramoId}</button>
        </div>`;
      box.querySelector('[data-go]').onclick = e => focus(e.currentTarget.dataset.go);
      return;
    }
    const t = Store.tramo(sel), m = Store.metrics(t), z = Store.zona(t.zona);
    const exps = Store.state.expedientes.filter(e => e.tramoId === t.id).sort((a, b) => (b.abierto - a.abierto) || b.id.localeCompare(a.id));
    const abiertos = exps.filter(e => e.abierto);
    const liqs = abiertos.map(e => Store.liquidacion(e));
    const canon = t.ocupaciones.reduce((a, o) => a + Store.calcCargos(t, o, undefined, { exceso: 0, meses: 1 }).regularMes, 0);
    const tot = k => liqs.reduce((a, l) => a + l[k], 0);
    const nFoto = m.det ?? m.aut;

    box.innerHTML = `
      <div class="detail-head">
        <div>
          <div class="eyebrow">${t.id} · ${t.tipo === 'poste' ? 'Tendido aéreo en postes' : 'Ducto subterráneo'}</div>
          <h3>${U.esc(t.calle)} ${t.altura}</h3>
          <div class="muted small">${U.esc(z.nombre)} · ${t.largo} m</div>
        </div>
        <button class="icon-btn" id="d-close" aria-label="Cerrar detalle">${U.icon('x')}</button>
      </div>
      <div class="mt-s">${U.badgeEstado(m.estado)}</div>
      <div class="compare">
        <div><span>Autorizados</span><b>${m.aut}</b></div>
        <div><span>Detectados</span><b class="${m.estado === 'critico' ? 't-crit' : m.estado === 'leve' ? 't-warn' : ''}">${m.det ?? '—'}</b></div>
        <div><span>Exceso</span><b>${m.exceso == null ? '—' : m.exceso > 0 ? '+' + m.exceso : '0'}</b></div>
        <div class="pct-ficha ${m.estado}">
          <div class="pct-top"><span>% de exceso</span><b>${m.ratio == null ? '—' : U.pct(m.ratio, 1)}</b></div>
          ${m.ratio == null ? '<small>Sin relevamiento</small>' : `
          <div class="pct-bar" role="img" aria-label="Exceso ${U.pct(m.ratio, 1)}; el umbral de crítico es 50 %"><i style="width:${Math.min(100, m.ratio / 1.5 * 100).toFixed(1)}%"></i><em style="left:${(0.5 / 1.5 * 100).toFixed(1)}%"></em></div>
          <div class="pct-scale"><span>0 %</span><span style="left:${(0.5 / 1.5 * 100).toFixed(1)}%">50 % · crítico</span><span>150 %+</span></div>
          <small>${m.ratio <= 0 ? 'Cumple: no hay cables por encima de lo autorizado.' : m.ratio <= 0.5 ? 'Exceso leve: hasta la mitad de lo autorizado.' : `Exceso crítico: ${U.num(m.exceso)} cables de más sobre ${U.num(m.aut)} autorizados.`}</small>`}
        </div>
      </div>
      <table class="table mini">
        <thead><tr><th>Proveedor</th><th class="num">Aut.</th><th class="num">Det.</th><th class="num">Exc.</th></tr></thead>
        <tbody>
          ${t.ocupaciones.map(o => { const p = Store.prov(o.prov), ex = o.detectados - o.autorizados; return `<tr><td><span class="dot" style="background:${p.color}"></span>${U.esc(p.corto)}</td><td class="num">${o.autorizados}</td><td class="num">${t.relevado ? o.detectados : '—'}</td><td class="num">${t.relevado && ex > 0 ? `<b class="t-crit">+${ex}</b>` : '0'}</td></tr>`; }).join('')}
          ${t.sinIdentificar ? `<tr><td><span class="dot" style="background:#8f96a0"></span><i>Sin identificar</i></td><td class="num">0</td><td class="num">${t.sinIdentificar}</td><td class="num"><b class="t-crit">+${t.sinIdentificar}</b></td></tr>` : ''}
        </tbody>
      </table>
      <figure class="photo">
        ${t.relevado ? `<img src="${U.posteDataURI(t.fotoSeed, nFoto)}" alt="Foto del relevamiento del tramo ${t.id}">` : `<div class="photo-empty">${U.icon('camera', 26)}<span>Sin relevamiento fotográfico</span></div>`}
        <figcaption>${t.relevado ? `Último relevamiento: <b>${U.fmtDate(t.ultimoRelevamiento)}</b> · ${U.esc(t.inspector)} · confianza ${U.pct(t.confianza)}<br>${U.esc(t.origen)}` : 'Pendiente de relevar'}</figcaption>
      </figure>
      <div class="section-title">Cargos calculados</div>
      <dl class="kv">
        <dt>Canon mensual regular</dt><dd>${U.money(canon)}</dd>
        ${liqs.length ? `
        <dt>Retroactivo por exceso</dt><dd>${U.money(tot('retro'))}</dd>
        <dt>Intereses por mora</dt><dd>${U.money(tot('interes'))}</dd>
        <dt>Multa</dt><dd>${U.money(tot('multa'))}</dd>
        <dt class="strong">Total a recuperar</dt><dd class="strong t-crit">${U.money(tot('total'))}</dd>` : `<dt>Deuda por exceso</dt><dd>${U.money(0)}</dd>`}
      </dl>
      <div class="section-title">Expedientes</div>
      ${exps.length ? `<ul class="exp-list">${exps.slice(0, 4).map(e => `
        <li><a href="#/expedientes?id=${e.id}"><b>${e.id}</b> · ${U.esc(Store.prov(e.prov).corto)}</a>
        <span>${e.abierto ? `<span class="badge b-info">${Store.ETAPAS[e.etapa]}</span> ${ExpedientesView.plazoBadge(e)}` : `<span class="badge b-ok">${U.icon('check', 12)}Cerrado</span>`}</span></li>`).join('')}</ul>` : '<p class="muted small">Sin expedientes.</p>'}
      <div class="btn-row mt">
        <a class="btn btn-primary btn-sm" href="#/relevamiento?tramo=${t.id}">${U.icon('camera', 15)} Relevar ahora</a>
        <a class="btn btn-sm" href="#/identificacion?tramo=${t.id}">${U.icon('tag', 15)} Identificar cables</a>
      </div>`;
    box.querySelector('#d-close').onclick = () => { sel = null; draw(); renderDetail(); };
  }

  function refresh() { draw(); renderDetail(); }

  return { render, destroy, refresh, focus };
})();

</script>
  <script>/* js/views/relevamiento.js */
/*
 * 3. RELEVAMIENTO Y CONTEO CON VISIÓN POR COMPUTADORA (simulado)
 * El inspector sube una foto/video georreferenciado; el "modelo" marca
 * cada cable con un recuadro, los cuenta y reporta su confianza; el
 * inspector confirma o corrige y queda la evidencia sellada con hash.
 */
const RelevamientoView = (() => {
  let root = null;
  // Estado local de la captura en curso
  let st = null;

  function nuevoEstado(tramoId) {
    const t = Store.tramo(tramoId);
    const m = Store.metrics(t);
    // "Verdad de campo" de la foto: lo instalado. Para un tramo sin relevar se simula.
    const real = t.relevado ? m.det : m.aut + Math.floor(Math.random() * 4);
    return { tramoId, real, fuente: null, fileURL: null, fileName: null, esVideo: false, fase: 'captura', ia: null, conf: null, boxes: [], ev: null, meta: null };
  }

  function render(el, params = {}) {
    root = el;
    const id = params.tramo || st?.tramoId || Store.CFG.casoDestacado.tramoId;
    if (!st || st.tramoId !== id) st = nuevoEstado(id);
    const tramos = [...Store.state.tramos].sort((a, b) => a.id.localeCompare(b.id));

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Relevamiento con visión por computadora</h1>
        <p class="muted">Captura georreferenciada, conteo automático de cables y validación del inspector. Cada relevamiento queda como evidencia con fecha, hora, coordenadas y huella digital.</p></div>
      </div>
      <div class="rel-layout">
        <div class="col">
          <div class="card">
            <div class="card-head"><h3><span class="step-n">1</span> Captura en campo</h3></div>
            <div class="form-row">
              <label class="field grow"><span>Tramo / poste</span>
                <select id="r-tramo">${tramos.map(t => { const m = Store.metrics(t); return `<option value="${t.id}" ${t.id === st.tramoId ? 'selected' : ''}>${t.id} · ${U.esc(t.calle)} ${t.altura} — ${U.ESTADOS[m.estado].label}</option>`; }).join('')}</select></label>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" id="r-muestra">${U.icon('camera', 16)} Tomar foto de muestra</button>
              <label class="btn">${U.icon('upload', 16)} Subir foto o video<input type="file" id="r-file" accept="image/*,video/*" hidden></label>
            </div>
            <div class="stage" id="rel-stage"></div>
            <div class="meta-row" id="r-meta"></div>
            <div class="btn-row mt">
              <button class="btn btn-accent" id="r-detectar">${U.icon('scan', 16)} Ejecutar detección automática</button>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card" id="rel-resultado"></div>
          <div class="card" id="rel-validacion"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Evidencias registradas</h3><span class="muted small">Registro inalterable: cada evidencia incluye su huella digital (hash)</span></div>
        <div class="table-wrap" id="r-evid"></div>
      </div>`;

    root.querySelector('#r-tramo').onchange = e => { st = nuevoEstado(e.target.value); renderAll(); };
    root.querySelector('#r-muestra').onclick = () => cargarMuestra();
    root.querySelector('#r-file').onchange = e => { const f = e.target.files[0]; if (f) cargarArchivo(f); };
    root.querySelector('#r-detectar').onclick = () => runDetection();
    renderAll();
  }

  function renderAll() { renderStage(); renderMeta(); renderResultado(); renderValidacion(); renderEvidencias(); }

  function renderStage(boxesVisibles = st.fase === 'resultado' || st.fase === 'validado' ? st.boxes.length : 0) {
    const stage = root.querySelector('#rel-stage');
    if (!stage) return;
    if (!st.fuente) {
      stage.innerHTML = `<div class="stage-empty">${U.icon('camera', 34)}<b>Sin imagen cargada</b><span>Tome una foto de muestra del poste o suba una propia (foto o video).</span></div>`;
      return;
    }
    let media;
    if (st.fuente === 'muestra') media = U.posteSVG(Store.tramo(st.tramoId).fotoSeed, st.real).svg;
    else if (st.esVideo) media = `<video src="${st.fileURL}" muted autoplay loop playsinline></video>`;
    else media = `<img src="${st.fileURL}" alt="Imagen subida">`;
    const boxes = st.boxes.slice(0, boxesVisibles).map((b, i) => `
      <g class="det-box" style="animation-delay:${0}ms">
        <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="3"/>
        <text x="${b.x + 2}" y="${b.y - 3}">cable ${i + 1} · ${b.c.toFixed(2)}</text>
      </g>`).join('');
    stage.innerHTML = `
      <div class="stage-media">${media}</div>
      <svg class="stage-overlay" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice">${boxes}</svg>
      ${st.fase === 'analizando' ? '<div class="scanline"></div><div class="stage-status">Analizando imagen · modelo de detección de cables v2.3…</div>' : ''}
      ${st.fase === 'resultado' || st.fase === 'validado' ? `<div class="stage-count">${st.ia} cables</div>` : ''}
      <div class="stage-gps">${U.icon('pin', 13)} ${st.meta.lat.toFixed(6)}, ${st.meta.lng.toFixed(6)} · ${U.fmtDate(st.meta.fecha)} ${st.meta.hora}</div>`;
  }

  function renderMeta() {
    const el = root.querySelector('#r-meta');
    if (!el) return;
    const t = Store.tramo(st.tramoId);
    el.innerHTML = st.meta ? `
      <span>${U.icon('pin', 14)} GPS ${st.meta.lat.toFixed(6)}, ${st.meta.lng.toFixed(6)} (±3 m)</span>
      <span>${U.icon('clock', 14)} ${U.fmtDate(st.meta.fecha)} ${st.meta.hora}</span>
      <span>${U.icon('file', 14)} ${U.esc(st.fileName)}</span>
      <span>${U.icon('user', 14)} ${U.esc(Store.usuarioActual())} · Tablet municipal T-07</span>`
      : `<span class="muted">Tramo ${t.id}: ${U.esc(t.calle)} ${t.altura} · ${t.ocupaciones.length} proveedor(es) con permiso · ${Store.metrics(t).aut} cables autorizados</span>`;
  }

  function capturaMeta(fileName) {
    const [lat, lng] = Store.midpoint(Store.tramo(st.tramoId));
    st.meta = { lat: lat + (Math.random() - 0.5) * 0.00003, lng: lng + (Math.random() - 0.5) * 0.00003, fecha: Store.state.hoy, hora: U.nowTime() };
    st.fileName = fileName;
  }

  /** Carga la foto de muestra del poste (también la usa la demo guiada) */
  function cargarMuestra() {
    st = { ...nuevoEstado(st.tramoId), real: st.real };
    st.fuente = 'muestra';
    capturaMeta(`IMG_${Store.state.hoy.replace(/-/g, '')}_${Math.floor(1000 + Math.random() * 9000)}.jpg`);
    renderAll();
  }
  function cargarArchivo(f) {
    st = { ...nuevoEstado(st.tramoId), real: st.real };
    st.fuente = 'archivo';
    st.esVideo = f.type.startsWith('video');
    st.fileURL = URL.createObjectURL(f);
    capturaMeta(f.name);
    renderAll();
  }

  /** Simula la inferencia del modelo: recuadros, conteo y confianza */
  async function runDetection() {
    if (!st.fuente) cargarMuestra();
    if (st.fase === 'analizando') return;
    const destacado = st.tramoId === Store.CFG.casoDestacado.tramoId;
    // El modelo puede equivocarse por ±1 cable (para mostrar la corrección del inspector)
    let ia = st.real;
    if (!destacado && Math.random() < 0.3) ia = Math.max(1, st.real + (Math.random() < 0.5 ? -1 : 1));
    const conf = destacado ? 0.94 : ia === st.real ? 0.9 + Math.random() * 0.07 : 0.72 + Math.random() * 0.1;
    // Recuadros: de la geometría del SVG de muestra o bandas genéricas sobre una foto subida
    let geo;
    if (st.fuente === 'muestra') geo = U.posteSVG(Store.tramo(st.tramoId).fotoSeed, st.real).boxes;
    else geo = Array.from({ length: st.real }, (_, i) => ({ x: i % 2 ? 330 : 170, y: 90 + i * (190 / st.real), w: 140, h: Math.max(12, 160 / st.real) }));
    const boxes = geo.slice(0, Math.min(ia, st.real)).map(b => ({ ...b, c: Math.min(0.99, conf + (Math.random() - 0.5) * 0.08) }));
    if (ia > st.real) { const b = geo[geo.length - 1]; boxes.push({ ...b, x: b.x + 12, y: b.y + 6, c: 0.51 }); }
    st.ia = ia; st.conf = conf; st.boxes = boxes; st.fase = 'analizando';
    renderStage(); renderResultado(); renderValidacion();
    await U.sleep(1800);
    for (let i = 1; i <= boxes.length; i++) { if (!root.isConnected) return; renderStage(i); await U.sleep(170); }
    st.fase = 'resultado';
    renderStage(); renderResultado(); renderValidacion();
  }

  function renderResultado() {
    const el = root.querySelector('#rel-resultado');
    if (!el) return;
    const t = Store.tramo(st.tramoId), m = Store.metrics(t);
    if (st.fase !== 'resultado' && st.fase !== 'validado') {
      el.innerHTML = `<div class="card-head"><h3><span class="step-n">2</span> Detección automática</h3></div>
        <p class="muted">${st.fase === 'analizando' ? 'Procesando la imagen…' : 'Cargue una imagen y ejecute la detección. El modelo identifica cada cable, lo encuadra y calcula su nivel de confianza.'}</p>
        ${st.fase === 'analizando' ? '<div class="progress"><div class="progress-bar indeterminate"></div></div>' : ''}`;
      return;
    }
    const exc = st.ia - m.aut;
    el.innerHTML = `
      <div class="card-head"><h3><span class="step-n">2</span> Detección automática</h3><span class="badge b-info">Modelo v2.3</span></div>
      <div class="big-count">
        <div><span>Cables detectados</span><b>${st.ia}</b></div>
        <div><span>Autorizados</span><b>${m.aut}</b></div>
        <div><span>Diferencia</span><b class="${exc > 0 ? 't-crit' : 't-ok'}">${exc > 0 ? '+' + exc : exc}</b></div>
      </div>
      <div class="conf"><span>Nivel de confianza</span><div class="meter"><div class="meter-fill ${st.conf >= 0.85 ? 'm-ok' : 'm-warn'}" style="width:${(st.conf * 100).toFixed(0)}%"></div></div><b>${U.pct(st.conf)}</b></div>
      ${st.conf < 0.85 ? `<p class="callout warn">${U.icon('alert', 15)} Confianza menor al 85 %: se recomienda revisión manual del conteo.</p>` : ''}
      ${exc > 0 ? `<p class="callout crit">${U.icon('alert', 15)} Se detectan <b>${exc} cables más</b> de los autorizados (${U.pct(exc / Math.max(m.aut, 1))} de exceso).</p>` : `<p class="callout ok">${U.icon('check', 15)} El conteo coincide con lo autorizado.</p>`}`;
  }

  function renderValidacion() {
    const el = root.querySelector('#rel-validacion');
    if (!el) return;
    const puede = Store.can('relevar');
    if (st.fase === 'validado' && st.ev) {
      const ev = st.ev, exps = Store.state.expedientes.filter(e => e.tramoId === ev.tramoId && e.evidenciaId === ev.id);
      el.innerHTML = `
        <div class="card-head"><h3><span class="step-n">3</span> Evidencia registrada</h3><span class="badge b-ok">${U.icon('check', 12)}Validado</span></div>
        <dl class="kv">
          <dt>Evidencia</dt><dd><b>${ev.id}</b></dd>
          <dt>Conteo IA / validado</dt><dd>${ev.conteoIA} / <b>${ev.conteo}</b> cables</dd>
          <dt>Fecha y hora</dt><dd>${U.fmtDate(ev.fecha)} ${ev.hora}</dd>
          <dt>Coordenadas</dt><dd>${ev.lat.toFixed(6)}, ${ev.lng.toFixed(6)}</dd>
          <dt>Inspector</dt><dd>${U.esc(ev.inspector)}</dd>
          <dt>Huella digital</dt><dd><code>${ev.hash}</code></dd>
        </dl>
        ${exps.length ? `<p class="callout info">${U.icon('folder', 15)} ${exps.map(e => `Expediente <a href="#/expedientes?id=${e.id}"><b>${e.id}</b></a> (${U.esc(Store.prov(e.prov).corto)}) pasó a <b>${Store.ETAPAS[e.etapa]}</b>.`).join(' ')}</p>` : ''}
        <div class="btn-row"><a class="btn btn-sm" href="#/cobro?exp=${exps[0]?.id || ''}">${U.icon('calc', 15)} Ver cálculo de cobro</a><button class="btn btn-sm" id="r-nuevo">Nuevo relevamiento</button></div>`;
      el.querySelector('#r-nuevo').onclick = () => { st = nuevoEstado(st.tramoId); renderAll(); };
      return;
    }
    const listo = st.fase === 'resultado';
    el.innerHTML = `
      <div class="card-head"><h3><span class="step-n">3</span> Validación del inspector</h3>${puede ? '' : `<span class="badge b-none">${U.icon('lock', 12)}Requiere rol Inspector</span>`}</div>
      <p class="muted small">El inspector verifica la imagen y confirma o corrige el conteo antes de que tenga efectos administrativos.</p>
      <div class="stepper-input ${listo ? '' : 'disabled'}">
        <button class="icon-btn" id="v-menos" ${listo ? '' : 'disabled'} aria-label="Restar">${U.icon('minus')}</button>
        <input id="v-conteo" type="number" min="0" value="${listo ? st.ia : ''}" ${listo ? '' : 'disabled'} aria-label="Conteo validado">
        <button class="icon-btn" id="v-mas" ${listo ? '' : 'disabled'} aria-label="Sumar">${U.icon('plus')}</button>
        <span class="muted small" id="v-dif"></span>
      </div>
      <label class="field mt-s"><span>Observaciones</span><textarea id="v-obs" rows="2" placeholder="Ej: 2 cables sin precinto en el lado norte" ${listo ? '' : 'disabled'}></textarea></label>
      <button class="btn btn-primary mt-s" id="v-confirmar" ${listo && puede ? '' : 'disabled'}>${U.icon('check', 16)} Confirmar conteo</button>`;
    const inp = el.querySelector('#v-conteo'), dif = el.querySelector('#v-dif'), btn = el.querySelector('#v-confirmar');
    const upd = () => {
      const v = +inp.value;
      const corr = st.ia != null && v !== st.ia;
      dif.textContent = corr ? `Corrige el conteo automático (${st.ia} → ${v})` : '';
      btn.innerHTML = `${U.icon('check', 16)} ${corr ? 'Corregir y confirmar' : 'Confirmar conteo'} (${v || 0} cables)`;
    };
    el.querySelector('#v-menos').onclick = () => { inp.value = Math.max(0, +inp.value - 1); upd(); };
    el.querySelector('#v-mas').onclick = () => { inp.value = +inp.value + 1; upd(); };
    inp.oninput = upd;
    btn.onclick = () => confirm();
    if (listo) upd();
  }

  /** Confirma el conteo y registra la evidencia (también la usa la demo guiada) */
  function confirm() {
    if (st.fase !== 'resultado') return null;
    const inp = root.querySelector('#v-conteo');
    const conteo = inp ? +inp.value : st.ia;
    const obs = root.querySelector('#v-obs')?.value || '';
    const ev = Store.registrarRelevamiento({ tramoId: st.tramoId, conteo, conteoIA: st.ia, confianza: st.conf, archivo: st.fileName, observaciones: obs });
    if (!ev) return null;
    st.ev = ev; st.fase = 'validado'; st.real = conteo;
    renderAll();
    U.toast(`Evidencia ${ev.id} registrada para ${ev.tramoId}`, 'ok');
    return ev;
  }

  function renderEvidencias() {
    const el = root.querySelector('#r-evid');
    if (!el) return;
    const evs = [...Store.state.evidencias].reverse().slice(0, 8);
    el.innerHTML = `<table class="table">
      <thead><tr><th>Evidencia</th><th>Tramo</th><th>Fecha y hora</th><th>Coordenadas</th><th class="num">IA</th><th class="num">Validado</th><th>Inspector</th><th>Hash</th></tr></thead>
      <tbody>${evs.map(v => `<tr><td><b>${v.id}</b></td><td>${v.tramoId}</td><td>${U.fmtDate(v.fecha)} ${v.hora.slice(0, 5)}</td><td class="small">${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}</td>
        <td class="num">${v.conteoIA}</td><td class="num"><b>${v.conteo}</b>${v.conteo !== v.conteoIA ? ' <span class="badge b-warn">corregido</span>' : ''}</td><td>${U.esc(v.inspector)}</td><td><code>${v.hash.slice(0, 10)}…</code></td></tr>`).join('')}</tbody></table>`;
  }

  /** Al cambiar el store (p. ej. rol) sólo se refrescan los paneles, sin perder la captura */
  function refresh() { if (!root || !root.isConnected) return; renderMeta(); renderValidacion(); renderEvidencias(); }

  function load(tramoId) { st = nuevoEstado(tramoId); if (root) { const s = root.querySelector('#r-tramo'); if (s) s.value = tramoId; renderAll(); } }

  return { render, refresh, load, cargarMuestra, runDetection, confirm };
})();

</script>
  <script>/* js/views/identificacion.js */
/*
 * 4. IDENTIFICACIÓN DE CABLES POR PROVEEDOR
 * Registro de precintos (QR / código de permiso), asignación de cada
 * cable a un proveedor y alertas de cables sin identificar o en desuso.
 */
const IdentificacionView = (() => {
  let root = null, selId = null;

  function render(el, params = {}) {
    root = el;
    if (params.tramo) selId = params.tramo;
    const S = Store.state, k = Store.kpis();
    const sinId = S.tramos.filter(t => t.relevado && t.sinIdentificar > 0);
    const desuso = [];
    S.tramos.forEach(t => t.relevado && t.ocupaciones.forEach(o => { if (o.desuso > 0) desuso.push({ t, o }); }));
    const sinPrecinto = S.tramos.reduce((a, t) => a + (t.relevado ? t.ocupaciones.reduce((b, o) => b + Math.max(0, o.detectados - o.identificados), 0) : 0), 0);
    if (!selId) selId = (sinId[0] || S.tramos[0]).id;
    const puede = Store.can('identificar');

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Identificación de cables</h1>
        <p class="muted">Cada cable debe llevar un precinto con código QR vinculado al permiso del proveedor. Los cables sin precinto o sin dueño generan alertas.</p></div>
      </div>
      <section class="kpi-grid kpi-4">
        <div class="card kpi"><div class="kpi-label">${U.icon('tag', 16)} Cables con precinto</div><div class="kpi-value">${U.pct(k.ident / Math.max(k.detRel, 1), 1)}</div><div class="kpi-sub">${U.num(k.ident)} de ${U.num(k.detRel)} cables relevados</div></div>
        <div class="card kpi"><div class="kpi-label">${U.icon('alert', 16)} Sin precinto (dueño conocido)</div><div class="kpi-value">${sinPrecinto}</div><div class="kpi-sub">Atribuidos por trazado; requieren precinto</div></div>
        <div class="card kpi kpi-alert"><div class="kpi-label">${U.icon('alert', 16)} Cables sin identificar</div><div class="kpi-value t-crit">${k.sinId}</div><div class="kpi-sub">En ${sinId.length} tramos · no se puede cobrar a nadie</div></div>
        <div class="card kpi"><div class="kpi-label">${U.icon('clock', 16)} Cables en desuso</div><div class="kpi-value t-warn">${k.desuso}</div><div class="kpi-sub">Deben retirarse o seguir pagando canon</div></div>
      </section>
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>Alerta: cables sin identificar</h3><span class="badge b-crit">${sinId.length} tramos</span></div>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Tramo</th><th>Ubicación</th><th class="num">Sin identificar</th><th></th></tr></thead>
            <tbody>${sinId.map(t => `<tr class="${t.id === selId ? 'row-sel' : ''}"><td><b>${t.id}</b></td><td>${U.esc(t.calle)} ${t.altura}</td><td class="num"><b class="t-crit">${t.sinIdentificar}</b></td>
              <td class="num"><button class="btn btn-sm" data-sel="${t.id}">Identificar</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No hay cables sin identificar.</td></tr>'}</tbody>
          </table></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Alerta: cables en desuso</h3><span class="badge b-warn">${desuso.length} casos</span></div>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Tramo</th><th>Proveedor</th><th class="num">Cables</th><th>Acción</th></tr></thead>
            <tbody>${desuso.map(({ t, o }) => `<tr><td><b>${t.id}</b> <span class="muted small">${U.esc(t.calle)}</span></td><td><span class="dot" style="background:${Store.prov(o.prov).color}"></span>${U.esc(Store.prov(o.prov).corto)}</td><td class="num">${o.desuso}</td>
              <td>${o.desusoNotificado ? '<span class="badge b-info">Retiro notificado</span>' : `<button class="btn btn-sm" data-desuso="${t.id}|${o.prov}" ${puede ? '' : 'disabled'}>Intimar retiro</button>`}</td></tr>`).join('')}</tbody>
          </table></div>
        </div>
      </div>
      <div class="card" id="id-detalle"></div>`;

    root.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { selId = b.dataset.sel; render(root); root.querySelector('#id-detalle').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    root.querySelectorAll('[data-desuso]').forEach(b => b.onclick = () => { const [t, p] = b.dataset.desuso.split('|'); Store.notificarDesuso(t, p); U.toast(`Se intimó a ${Store.prov(p).corto} a retirar el cable en desuso (15 días).`, 'ok'); });
    renderDetalle();
  }

  function renderDetalle() {
    const el = root.querySelector('#id-detalle');
    const t = Store.tramo(selId), cables = Store.cablesDe(t), puede = Store.can('identificar');
    const EST = {
      'identificado': '<span class="badge b-ok">Identificado</span>',
      'sin-precinto': '<span class="badge b-warn">Sin precinto</span>',
      'desuso': '<span class="badge b-none">En desuso</span>',
      'sin-identificar': '<span class="badge b-crit">Sin identificar</span>',
    };
    el.innerHTML = `
      <div class="card-head">
        <h3>Registro de precintos · ${t.id} — ${U.esc(t.calle)} ${t.altura}</h3>
        <label class="field inline"><span>Tramo</span><select id="id-tramo">${Store.state.tramos.filter(x => x.relevado).map(x => `<option value="${x.id}" ${x.id === selId ? 'selected' : ''}>${x.id} · ${U.esc(x.calle)} ${x.altura}${x.sinIdentificar ? ' ⚠' : ''}</option>`).join('')}</select></label>
      </div>
      ${puede ? '' : `<p class="callout info">${U.icon('lock', 15)} Su rol puede consultar pero no modificar. Las asignaciones las realiza un Inspector.</p>`}
      <div class="table-wrap"><table class="table">
        <thead><tr><th>#</th><th>Precinto (QR)</th><th>Proveedor</th><th>Permiso</th><th>Estado</th><th>Acción</th></tr></thead>
        <tbody>${cables.map(c => `<tr>
          <td>${c.n}</td>
          <td>${c.precinto ? `<span class="qr-mini">${U.qrSVG(c.precinto, 22)}</span><code>${c.precinto}</code>` : '<span class="muted">—</span>'}</td>
          <td>${c.prov ? `<span class="dot" style="background:${c.color}"></span>${U.esc(c.provNombre)}${c.excedente ? ' <span class="badge b-crit">fuera de permiso</span>' : ''}` : '<i class="muted">Desconocido</i>'}</td>
          <td class="small">${c.prov ? c.permiso : '—'}</td>
          <td>${EST[c.estado]}</td>
          <td>${c.estado === 'sin-identificar' ? `
              <div class="inline-actions">
                <button class="btn btn-sm" data-scan ${puede ? '' : 'disabled'}>${U.icon('scan', 14)} Escanear QR</button>
                <select data-asig ${puede ? '' : 'disabled'}><option value="">Asignar manualmente…</option>${Store.CFG.proveedores.map(p => `<option value="${p.id}">${U.esc(p.corto)}</option>`).join('')}</select>
              </div>`
            : c.estado === 'sin-precinto' ? `<button class="btn btn-sm" data-precinto="${c.prov}" ${puede ? '' : 'disabled'}>Colocar precinto</button>` : ''}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;

    el.querySelector('#id-tramo').onchange = e => { selId = e.target.value; renderDetalle(); };
    el.querySelectorAll('[data-precinto]').forEach(b => b.onclick = () => Store.colocarPrecinto(selId, b.dataset.precinto));
    el.querySelectorAll('[data-asig]').forEach(s => s.onchange = () => { if (s.value) { Store.asignarCable(selId, s.value, 'asignación manual por trazado'); U.toast(`Cable asignado a ${Store.prov(s.value).corto}`, 'ok'); } });
    el.querySelectorAll('[data-scan]').forEach(b => b.onclick = () => escanear());
  }

  /** Simula la lectura del precinto QR con la cámara de la tablet */
  function escanear() {
    const t = Store.tramo(selId);
    // El precinto leído pertenece a algún proveedor presente (o a uno sin permiso en el tramo)
    const pool = t.ocupaciones.map(o => o.prov);
    const provId = Math.random() < 0.8 && pool.length ? pool[Math.floor(Math.random() * pool.length)] : Store.CFG.proveedores[Math.floor(Math.random() * Store.CFG.proveedores.length)].id;
    const p = Store.prov(provId);
    const code = `${p.permisoMarco}/${t.id}`;
    const m = U.modal({
      title: 'Lectura de precinto QR', size: 'sm',
      body: `<div class="scan-box"><div class="scan-qr">${U.qrSVG(code, 140)}<div class="scanline"></div></div><p class="muted" id="scan-msg">Apuntando la cámara al precinto…</p></div>`,
    });
    setTimeout(() => {
      if (!m.el.isConnected) return;
      const sinPermiso = !t.ocupaciones.some(o => o.prov === provId);
      m.setBody(`<div class="scan-box"><div class="scan-qr">${U.qrSVG(code, 140)}</div>
        <dl class="kv"><dt>Código leído</dt><dd><code>${code}</code></dd><dt>Proveedor</dt><dd><b>${U.esc(p.nombre)}</b></dd><dt>CUIT</dt><dd>${p.cuit}</dd></dl>
        ${sinPermiso ? `<p class="callout crit">${U.icon('alert', 15)} El proveedor no tiene permiso en este tramo: se generará un expediente.</p>` : ''}</div>`);
      m.setFoot(`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="scan-ok">Asignar cable a ${U.esc(p.corto)}</button>`);
      m.foot.querySelector('#scan-ok').onclick = () => { m.close(); Store.asignarCable(selId, provId, 'lectura de precinto QR'); U.toast(`Cable asignado a ${p.corto}`, 'ok'); };
    }, 1500);
  }

  return { render, refresh: () => root && root.isConnected && render(root) };
})();

</script>
  <script>/* js/views/cobro.js */
/*
 * 5. MOTOR DE CÁLCULO DE COBRO + SIMULADOR "WHAT-IF"
 * Los deslizadores modifican un ESCENARIO (no la tarifa vigente) y todos
 * los montos se recalculan en tiempo real. "Aplicar" lo vuelve vigente
 * (requiere rol Hacienda o Administrador) y queda en la auditoría.
 */
const CobroView = (() => {
  let root = null, esc = null, expSel = null;

  const PARAMS = [
    { key: 'tarifaCableMetroMes', label: 'Tarifa por cable, por metro y por mes', min: 20, max: 300, step: 5, fmt: v => U.money(v) },
    { key: 'tarifaPosteMes', label: 'Tarifa por poste ocupado (por proveedor, por mes)', min: 0, max: 60000, step: 1000, fmt: v => U.money(v) },
    { key: 'recargoExceso', label: 'Recargo por exceso no declarado', min: 0, max: 300, step: 10, fmt: v => `${v} %` },
    { key: 'interesMoraMensual', label: 'Interés por mora (mensual)', min: 0, max: 10, step: 0.5, fmt: v => `${U.num(v, 1)} %` },
    { key: 'multaPorCable', label: 'Multa por cable no declarado', min: 0, max: 1500000, step: 25000, fmt: v => U.money(v) },
  ];

  // Escenarios predefinidos (el estándar es la tarifa de la ordenanza)
  const PRESETS = {
    conservador: { label: 'Conservador', v: { tarifaCableMetroMes: 60, tarifaPosteMes: 10000, recargoExceso: 50, interesMoraMensual: 2, multaPorCable: 250000 } },
    estandar: { label: 'Estándar', v: () => ({ ...Store.CFG.tarifas }) },
    ambicioso: { label: 'Ambicioso', v: { tarifaCableMetroMes: 130, tarifaPosteMes: 25000, recargoExceso: 200, interesMoraMensual: 5, multaPorCable: 800000 } },
  };
  const presetDe = k => { const p = PRESETS[k].v; return typeof p === 'function' ? p() : { ...p }; };
  const presetActual = () => Object.keys(PRESETS).find(k => PARAMS.every(p => presetDe(k)[p.key] === esc[p.key]));

  function render(el, params = {}) {
    root = el;
    if (!esc) esc = { ...Store.state.params };
    const abiertos = Store.state.expedientes.filter(e => e.abierto).sort((a, b) => Store.liquidacion(b).total - Store.liquidacion(a).total);
    if (params.exp && Store.exp(params.exp)) expSel = params.exp;
    if (!expSel || !Store.exp(expSel)) expSel = (Store.expedienteDestacado() || abiertos[0]).id;
    const puede = Store.can('tarifas');

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Motor de cálculo de cobro</h1>
        <p class="muted">Parámetros según ${Store.CFG.municipio.ordenanza}. Mueva los valores para simular escenarios: los montos se recalculan al instante sin afectar la tarifa vigente.</p></div>
      </div>
      <div class="cobro-layout">
        <div class="card" id="cobro-params">
          <div class="card-head"><h3>Parámetros del escenario</h3>${puede ? '' : `<span class="badge b-none">${U.icon('lock', 12)}Sólo simulación</span>`}</div>
          <div class="preset-row" role="group" aria-label="Escenarios predefinidos">${Object.entries(PRESETS).map(([k, p]) => `<button class="btn btn-sm${presetActual() === k ? ' active' : ''}" data-preset="${k}">${p.label}</button>`).join('')}</div>
          ${PARAMS.map(p => `
            <div class="slider-row">
              <div class="slider-top"><label for="s-${p.key}">${p.label}</label><b id="v-${p.key}">${p.fmt(esc[p.key])}</b></div>
              <input type="range" id="s-${p.key}" data-k="${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${esc[p.key]}">
              <div class="slider-foot muted small">Vigente: ${p.fmt(Store.state.params[p.key])} <span id="d-${p.key}"></span></div>
            </div>`).join('')}
          <div class="btn-row">
            <button class="btn" id="c-reset">Volver a la tarifa vigente</button>
            <button class="btn btn-primary" id="c-aplicar" ${puede ? '' : 'disabled title="Requiere rol Hacienda o Administrador"'}>Aplicar como tarifa vigente</button>
          </div>
        </div>
        <div class="col">
          <div class="scenario-grid" id="cobro-resultados"></div>
          <div class="card">
            <div class="card-head"><h3>Impacto por proveedor</h3><span class="muted small">Vigente → escenario</span></div>
            <div class="table-wrap" id="cobro-prov"></div>
          </div>
        </div>
      </div>
      <div class="card" id="cobro-detalle">
        <div class="card-head">
          <h3>Liquidación detallada de un expediente</h3>
          <label class="field inline"><span>Expediente</span><select id="c-exp">${abiertos.map(e => `<option value="${e.id}" ${e.id === expSel ? 'selected' : ''}>${e.id} · ${e.tramoId} · ${U.esc(Store.prov(e.prov).corto)}</option>`).join('')}</select></label>
        </div>
        <div id="cobro-calc"></div>
      </div>`;

    root.querySelectorAll('input[type=range]').forEach(s => s.oninput = () => { esc[s.dataset.k] = +s.value; refreshOutputs(); });
    root.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { esc = presetDe(b.dataset.preset); render(root); U.toast(`Escenario ${PRESETS[b.dataset.preset].label.toLowerCase()} cargado en el simulador.`); });
    root.querySelector('#c-reset').onclick = () => { esc = { ...Store.state.params }; render(root); };
    root.querySelector('#c-aplicar').onclick = () => { if (Store.setParams(esc)) U.toast('Nuevas tarifas aplicadas y registradas en auditoría.', 'ok'); };
    root.querySelector('#c-exp').onchange = e => { expSel = e.target.value; refreshOutputs(); };
    refreshOutputs();
  }

  const delta = (a, b) => {
    const d = b - a;
    if (Math.abs(d) < 1) return '<span class="delta">sin cambios</span>';
    return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${U.moneyShort(Math.abs(d))} (${d > 0 ? '+' : '−'}${U.pct(Math.abs(d) / Math.max(a, 1), 1)})</span>`;
  };

  /** Recalcula todas las salidas con el escenario actual (tiempo real) */
  function refreshOutputs() {
    if (!root || !root.isConnected) return;
    const vig = Store.totals(Store.state.params), sim = Store.totals(esc);
    const pa = presetActual(); root.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === pa));
    PARAMS.forEach(p => {
      root.querySelector(`#v-${p.key}`).textContent = p.fmt(esc[p.key]);
      const s = root.querySelector(`#s-${p.key}`); if (+s.value !== esc[p.key]) s.value = esc[p.key];
      const changed = esc[p.key] !== Store.state.params[p.key];
      root.querySelector(`#d-${p.key}`).innerHTML = changed ? '<span class="badge b-info">modificado</span>' : '';
    });
    const card = (label, a, b, sub) => `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${U.moneyShort(b)}</div><div class="kpi-sub">Vigente ${U.moneyShort(a)} ${delta(a, b)}</div>${sub ? `<div class="kpi-sub muted">${sub}</div>` : ''}</div>`;
    root.querySelector('#cobro-resultados').innerHTML =
      card('Recaudación mensual regular', vig.regularMes, sim.regularMes, 'Canon por cables autorizados y postes') +
      card('Recaudación mensual potencial', vig.potencialMes, sim.potencialMes, 'Si se cobra todo lo instalado') +
      card('Monto a recuperar (expedientes abiertos)', vig.aRecuperar, sim.aRecuperar, `Retroactivo ${U.moneyShort(sim.retro)} · intereses ${U.moneyShort(sim.interes)} · multas ${U.moneyShort(sim.multas)}`) +
      card('Ingreso del primer año (potencial + recupero)', vig.potencialMes * 12 + vig.aRecuperar, sim.potencialMes * 12 + sim.aRecuperar, 'Proyección con regularización total');

    root.querySelector('#cobro-prov').innerHTML = `<table class="table">
      <thead><tr><th>Proveedor</th><th class="num">Canon mensual</th><th class="num">Deuda vigente</th><th class="num">Deuda escenario</th><th>Variación</th></tr></thead>
      <tbody>${Store.CFG.proveedores.map(p => `<tr>
        <td><span class="dot" style="background:${p.color}"></span>${U.esc(p.corto)}</td>
        <td class="num">${U.money(sim.porProvMes[p.id] || 0)}</td>
        <td class="num">${U.money(vig.porProv[p.id] || 0)}</td>
        <td class="num"><b>${U.money(sim.porProv[p.id] || 0)}</b></td>
        <td>${delta(vig.porProv[p.id] || 0, sim.porProv[p.id] || 0)}</td></tr>`).join('')}</tbody></table>`;

    renderCalc();
  }

  function renderCalc() {
    const e = Store.exp(expSel), el = root.querySelector('#cobro-calc');
    if (!e) { el.innerHTML = '<p class="muted">Sin expedientes abiertos.</p>'; return; }
    const t = Store.tramo(e.tramoId), o = Store.ocup(t, e.prov), p = Store.prov(e.prov);
    const congelada = !!e.liquidacion;
    const c = congelada ? e.liquidacion : Store.calcCargos(t, o, esc);
    const amn = Store.calcCargos(t, o, esc, { amnistia: true });
    const P = congelada ? Store.state.params : esc;
    const canonNuevo = Store.calcCargos(t, { ...o, autorizados: o.detectados }, P, { exceso: 0, meses: 1 }).regularMes;
    el.innerHTML = `
      ${congelada ? `<p class="callout info">${U.icon('lock', 15)} Liquidación ya emitida (${e.regularizacion?.tipo === 'voluntaria' ? 'regularización voluntaria' : 'congelada'}); no la afecta el simulador.</p>` : ''}
      <div class="calc-grid">
        <div>
          <dl class="kv">
            <dt>Tramo</dt><dd>${t.id} · ${U.esc(t.calle)} ${t.altura} (${t.largo} m, ${t.tipo})</dd>
            <dt>Proveedor</dt><dd><span class="dot" style="background:${p.color}"></span>${U.esc(p.nombre)}</dd>
            <dt>Cables autorizados / detectados</dt><dd>${c.aut} / <b>${c.det}</b> → exceso <b class="t-crit">${c.exc}</b></dd>
            <dt>Instalación estimada del exceso</dt><dd>${U.fmtDate(o.instalacionExceso)} (${c.meses} meses)</dd>
          </dl>
        </div>
        <table class="table calc">
          <tbody>
            <tr><td>Canon regular mensual</td><td class="formula">${c.aut} cables × ${t.largo} m × ${U.money(P.tarifaCableMetroMes)}${c.posteMes ? ` + ${U.money(c.posteMes)} poste` : ''}</td><td class="num">${U.money(c.regularMes)}</td></tr>
            <tr><td>Exceso mensual con recargo</td><td class="formula">${c.exc} × ${t.largo} m × ${U.money(P.tarifaCableMetroMes)} × (1 + ${U.num(c.recargo * 100)} %)</td><td class="num">${U.money(c.excesoMes)}</td></tr>
            <tr><td>Cobro retroactivo</td><td class="formula">${U.money(c.excesoMes)} × ${c.meses} meses</td><td class="num">${U.money(c.retro)}</td></tr>
            <tr><td>Intereses por mora</td><td class="formula">${U.num(P.interesMoraMensual, 1)} % mensual sobre saldo promedio</td><td class="num">${U.money(c.interes)}</td></tr>
            <tr><td>Multa</td><td class="formula">${c.exc} cables × ${U.money(P.multaPorCable)}</td><td class="num">${U.money(c.multa)}</td></tr>
            <tr class="total"><td>Total a recuperar</td><td></td><td class="num" id="calc-total">${U.money(c.total)}</td></tr>
          </tbody>
        </table>
      </div>
      <div class="calc-foot">
        <div class="mini-stat"><span>Si regulariza en el régimen voluntario</span><b>${U.money(amn.total)}</b><small>sin recargo, intereses ni multa</small></div>
        <div class="mini-stat"><span>Canon mensual tras regularizar</span><b>${U.money(canonNuevo)}</b><small>antes ${U.money(c.regularMes)} · +${U.money(canonNuevo - c.regularMes)} por mes</small></div>
        <a class="btn" href="#/expedientes?id=${e.id}">${U.icon('folder', 15)} Ir al expediente ${e.id}</a>
      </div>`;
  }

  /** Cambia un parámetro del escenario (usado por la demo guiada para el what-if) */
  function setEsc(key, value) { esc[key] = value; refreshOutputs(); }
  function resetEsc() { esc = { ...Store.state.params }; if (root && root.isConnected) refreshOutputs(); }

  // Re-render completo: el escenario vive en este módulo, así que no se pierde
  function refresh() { if (root && root.isConnected) render(root); }

  return { render, refresh, setEsc, resetEsc };
})();

</script>
  <script>/* js/views/expedientes.js */
/*
 * 6. GESTIÓN DE EXPEDIENTES Y SANCIONES (workflow)
 * Detección → validación → intimación → plazo → multa/cobro → retiro → cierre.
 * Incluye semáforo de plazos, intimación imprimible (PDF) y el régimen
 * de regularización voluntaria (amnistía).
 */
const ExpedientesView = (() => {
  let root = null, detalle = null;     // detalle = {id, modal}
  const filtro = { etapa: null, prov: '', plazo: '', q: '' };

  function plazoBadge(e) {
    if (!e.abierto) return '<span class="badge b-none">Cerrado</span>';
    const d = Store.diasRestantes(e), st = Store.plazoEstado(e);
    if (d == null) return '';
    const cls = st === 'vencido' ? 'crit' : st === 'proximo' ? 'warn' : 'ok';
    const txt = d < 0 ? `Vencido hace ${-d} d` : d === 0 ? 'Vence hoy' : `${d} días`;
    return `<span class="badge b-${cls}">${U.icon(st === 'ok' ? 'clock' : 'alert', 12)}${txt}</span>`;
  }

  function render(el, params = {}) {
    root = el;
    if (params.prov) Object.assign(filtro, { prov: params.prov, etapa: null, plazo: '', q: '' });
    const S = Store.state, puedeAmn = Store.can('amnistia');
    const abiertos = S.expedientes.filter(e => e.abierto);
    const porEtapa = Store.ETAPAS.map((_, i) => i === 6 ? S.expedientes.filter(e => !e.abierto).length : abiertos.filter(e => e.etapa === i).length);
    const venc = abiertos.filter(e => Store.plazoEstado(e) === 'vencido').length;
    const prox = abiertos.filter(e => Store.plazoEstado(e) === 'proximo').length;

    root.innerHTML = `
      <div class="page-head">
        <div><h1>Expedientes y sanciones</h1>
        <p class="muted">${abiertos.length} expedientes abiertos · <span class="t-crit">${venc} con plazo vencido</span> · <span class="t-warn">${prox} vencen en 5 días o menos</span></p></div>
      </div>

      <div class="card amnistia ${S.amnistia.activa ? 'on' : ''}" id="exp-amnistia">
        <div>
          <h3>${U.icon('shield', 18)} Régimen de regularización voluntaria</h3>
          <p class="muted small">Los proveedores que declaren lo realmente instalado dentro del plazo pagan sólo el canon retroactivo, <b>sin multa, recargo ni intereses</b>. Aplica a expedientes que aún no tienen multa.</p>
        </div>
        <div class="amn-ctrl">
          <label class="switch"><input type="checkbox" id="amn-on" ${S.amnistia.activa ? 'checked' : ''} ${puedeAmn ? '' : 'disabled'}><span></span> ${S.amnistia.activa ? 'Vigente' : 'Inactivo'}</label>
          <label class="field inline"><span>Hasta</span><input type="date" id="amn-hasta" value="${S.amnistia.hasta}" ${puedeAmn ? '' : 'disabled'}></label>
          <button class="btn btn-sm" id="amn-save" ${puedeAmn ? '' : 'disabled title="Requiere rol Legal o Administrador"'}>Guardar</button>
        </div>
      </div>

      <div class="pipeline" id="exp-pipeline">
        ${Store.ETAPAS.map((n, i) => `<button class="pipe ${filtro.etapa === i ? 'on' : ''}" data-etapa="${i}"><span class="pipe-n">${porEtapa[i]}</span><span class="pipe-l">${i + 1}. ${n}</span></button>`).join('')}
      </div>

      <div class="card filters">
        <label class="field"><span>Proveedor</span><select id="fe-prov"><option value="">Todos</option>${Store.CFG.proveedores.map(p => `<option value="${p.id}" ${filtro.prov === p.id ? 'selected' : ''}>${U.esc(p.corto)}</option>`).join('')}</select></label>
        <label class="field"><span>Plazo</span><select id="fe-plazo">
          <option value="">Todos</option><option value="vencido" ${filtro.plazo === 'vencido' ? 'selected' : ''}>Vencidos</option>
          <option value="proximo" ${filtro.plazo === 'proximo' ? 'selected' : ''}>Por vencer (≤ 5 días)</option><option value="ok" ${filtro.plazo === 'ok' ? 'selected' : ''}>En término</option>
          <option value="cerrado" ${filtro.plazo === 'cerrado' ? 'selected' : ''}>Cerrados</option></select></label>
        <label class="field grow"><span>Buscar</span><input type="search" id="fe-q" placeholder="Expediente, tramo o calle" value="${U.esc(filtro.q)}"></label>
        ${filtro.etapa != null ? `<button class="btn btn-sm" id="fe-clear">Quitar filtro de etapa</button>` : ''}
      </div>
      <div class="card"><div class="table-wrap" id="exp-tabla"></div></div>`;

    root.querySelectorAll('[data-etapa]').forEach(b => b.onclick = () => { const i = +b.dataset.etapa; filtro.etapa = filtro.etapa === i ? null : i; render(root); });
    root.querySelector('#fe-prov').onchange = e => { filtro.prov = e.target.value; renderTabla(); };
    root.querySelector('#fe-plazo').onchange = e => { filtro.plazo = e.target.value; renderTabla(); };
    root.querySelector('#fe-q').oninput = e => { filtro.q = e.target.value.trim().toLowerCase(); renderTabla(); };
    const clr = root.querySelector('#fe-clear'); if (clr) clr.onclick = () => { filtro.etapa = null; render(root); };
    root.querySelector('#amn-save').onclick = () => {
      if (Store.setAmnistia(root.querySelector('#amn-on').checked, root.querySelector('#amn-hasta').value)) U.toast('Régimen de regularización actualizado.', 'ok');
    };
    renderTabla();
    if (params.id && (!detalle || detalle.id !== params.id)) openDetail(params.id);
  }

  function renderTabla() {
    const el = root.querySelector('#exp-tabla');
    const list = Store.state.expedientes.filter(e => {
      if (filtro.etapa != null && (filtro.etapa === 6 ? e.abierto : (!e.abierto || e.etapa !== filtro.etapa))) return false;
      if (filtro.prov && e.prov !== filtro.prov) return false;
      if (filtro.plazo && Store.plazoEstado(e) !== filtro.plazo) return false;
      if (filtro.q) { const t = Store.tramo(e.tramoId); if (!(e.id.toLowerCase().includes(filtro.q) || e.tramoId.toLowerCase().includes(filtro.q) || t.calle.toLowerCase().includes(filtro.q))) return false; }
      return true;
    }).sort((a, b) => (b.abierto - a.abierto) || (a.abierto ? (a.vence || '').localeCompare(b.vence || '') : b.id.localeCompare(a.id)));
    el.innerHTML = `<table class="table">
      <thead><tr><th>Expediente</th><th>Tramo</th><th>Proveedor</th><th class="num">Exceso</th><th>Etapa</th><th>Plazo</th><th class="num">Monto</th></tr></thead>
      <tbody>${list.map(e => {
        const t = Store.tramo(e.tramoId), l = Store.liquidacion(e);
        return `<tr class="clickable" data-id="${e.id}">
          <td><b>${e.id}</b>${e.regularizacion ? ' <span class="badge b-info">DJ</span>' : ''}</td>
          <td>${e.tramoId} · ${U.esc(t.calle)} ${t.altura}</td>
          <td><span class="dot" style="background:${Store.prov(e.prov).color}"></span>${U.esc(Store.prov(e.prov).corto)}</td>
          <td class="num">+${e.abierto ? l.exc : e.cablesExceso ?? l.exc}</td>
          <td>${e.abierto ? Store.ETAPAS[e.etapa] : `<span class="muted">${U.esc(e.resultado || 'Cerrado')}</span>`}</td>
          <td>${plazoBadge(e)}</td>
          <td class="num">${U.money(e.abierto ? l.total : e.montoCobrado)}</td></tr>`;
      }).join('') || '<tr><td colspan="7" class="muted">Sin resultados.</td></tr>'}</tbody></table>`;
    el.querySelectorAll('[data-id]').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
  }

  // ---------- Detalle del expediente ----------
  function openDetail(id) {
    if (detalle) detalle.modal.close();
    const m = U.modal({ title: `Expediente ${id}`, size: 'lg', onClose: () => { if (detalle && detalle.id === id) detalle = null; } });
    detalle = { id, modal: m };
    renderDetail();
    return m;
  }

  function stepper(e) {
    const hechas = new Set(e.historial.map(h => h.etapa));
    return `<ol class="stepper">${Store.ETAPAS.map((n, i) => {
      const cls = i === e.etapa && e.abierto ? 'current' : hechas.has(i) ? 'done' : i < e.etapa ? 'skipped' : '';
      return `<li class="${cls}"><span class="st-dot">${hechas.has(i) && !(i === e.etapa && e.abierto) ? U.icon('check', 12) : i + 1}</span><span class="st-l">${n}</span></li>`;
    }).join('')}</ol>`;
  }

  function renderDetail() {
    if (!detalle) return;
    const e = Store.exp(detalle.id), t = Store.tramo(e.tramoId), p = Store.prov(e.prov), o = Store.ocup(t, e.prov);
    const l = Store.liquidacion(e), ev = Store.state.evidencias.find(v => v.id === e.evidenciaId);
    const can = Store.can;
    const acciones = [];
    if (e.abierto) {
      if (e.etapa === 0) {
        acciones.push(`<a class="btn" href="#/relevamiento?tramo=${t.id}" data-close>${U.icon('camera', 15)} Validar en campo</a>`);
        acciones.push(btn('validar', 'Validar con relevamiento existente', 'relevar', 'btn-primary'));
      }
      if (e.etapa === 1) acciones.push(btn('preview', 'Generar intimación', 'intimar', 'btn-primary', 'file'));
      if (e.etapa === 2) { acciones.push(btn('verint', 'Ver intimación', null, '', 'file')); acciones.push(btn('notificar', 'Registrar notificación e iniciar plazo', 'intimar', 'btn-primary')); }
      if (e.etapa === 3) { acciones.push(btn('verint', 'Ver intimación', null, '', 'file')); acciones.push(btn('multa', 'Plazo vencido: aplicar multa', 'sancionar', 'btn-danger')); }
      if (e.etapa === 4) { acciones.push(btn('pago', 'Registrar pago', 'cobrar', 'btn-primary', 'money')); if (!e.regularizacion) acciones.push(btn('retiro', 'Ordenar retiro de cables', 'sancionar', 'btn-danger')); }
      if (e.etapa === 5) acciones.push(btn('confirmar-retiro', 'Confirmar retiro ejecutado', 'sancionar', 'btn-danger'));
    }
    function btn(act, label, perm, cls = '', ic = 'arrow') {
      const ok = !perm || can(perm);
      return `<button class="btn ${cls}" data-act="${act}" ${ok ? '' : `disabled title="Requiere permiso: ${Store.PERMISOS[perm]}"`}>${U.icon(ok ? ic : 'lock', 15)} ${label}</button>`;
    }

    detalle.modal.setBody(`
      <div class="exp-head">
        <div>
          <div class="eyebrow">${t.id} · ${U.esc(t.calle)} ${t.altura} · ${U.esc(Store.zona(t.zona).nombre)}</div>
          <h2>${U.esc(p.nombre)}</h2>
          <div class="muted small">CUIT ${p.cuit} · Permiso ${p.permisoMarco}</div>
        </div>
        <div class="exp-badges">${e.abierto ? `<span class="badge b-info">${Store.ETAPAS[e.etapa]}</span> ${plazoBadge(e)}` : `<span class="badge b-ok">${U.icon('check', 12)}Cerrado</span>`}
          ${e.regularizacion?.tipo === 'voluntaria' ? '<span class="badge b-ok">Regularización voluntaria</span>' : ''}</div>
      </div>
      ${stepper(e)}
      ${e.abierto && e.etapa === 3 ? `<p class="callout info">${U.icon('clock', 15)} El proveedor tiene hasta el <b>${U.fmtDate(e.vence)}</b> para declarar y regularizar desde su portal${Store.state.amnistia.activa ? ' (con el régimen voluntario vigente, sin multa)' : ''}.</p>` : ''}
      ${!e.abierto ? `<p class="callout ok">${U.icon('check', 15)} ${U.esc(e.resultado)} · cerrado el ${U.fmtDate(e.fechaCierre)} · cobrado ${U.money(e.montoCobrado)}</p>` : ''}
      <div class="exp-grid">
        <div>
          <div class="section-title">Situación del tramo</div>
          <div class="compare small-c">
            <div><span>Autorizados</span><b>${l.aut}</b></div><div><span>Detectados</span><b class="t-crit">${l.det}</b></div><div><span>Exceso</span><b>+${l.exc}</b></div>
          </div>
          <div class="section-title">Evidencia</div>
          <figure class="photo">
            <img src="${U.posteDataURI(t.fotoSeed, l.det)}" alt="Evidencia fotográfica">
            <figcaption>${ev ? `<b>${ev.id}</b> · ${U.fmtDate(ev.fecha)} ${ev.hora} · ${ev.lat.toFixed(5)}, ${ev.lng.toFixed(5)}<br>IA ${ev.conteoIA} / validado ${ev.conteo} · ${U.esc(ev.inspector)} · hash <code>${ev.hash.slice(0, 12)}…</code>` : `Relevamiento automático del ${U.fmtDate(t.ultimoRelevamiento)} · ${U.esc(t.origen || '')} · pendiente de validación en campo`}</figcaption>
          </figure>
        </div>
        <div>
          <div class="section-title">Liquidación ${e.liquidacion ? '(emitida)' : '(en vivo)'}</div>
          <dl class="kv">
            <dt>Canon regular mensual</dt><dd>${U.money(l.regularMes)}</dd>
            <dt>Exceso mensual (${l.amnistia ? 'sin recargo' : `recargo ${U.num(l.recargo * 100)} %`})</dt><dd>${U.money(l.excesoMes)}</dd>
            <dt>Retroactivo (${l.meses} meses)</dt><dd>${U.money(l.retro)}</dd>
            <dt>Intereses por mora</dt><dd>${U.money(l.interes)}</dd>
            <dt>Multa</dt><dd>${U.money(l.multa)}</dd>
            <dt class="strong">Total</dt><dd class="strong t-crit" id="exp-total">${U.money(l.total)}</dd>
          </dl>
          <a class="small" href="#/cobro?exp=${e.id}" data-close>Ver el cálculo paso a paso →</a>
          <div class="section-title">Historial</div>
          <ul class="timeline">${[...e.historial].reverse().map(h => `<li><span class="tl-date">${U.fmtDate(h.fecha)} ${h.hora ? h.hora.slice(0, 5) : ''}</span><b>${Store.ETAPAS[h.etapa]}</b> — ${U.esc(h.texto)}<span class="tl-user">${U.esc(h.usuario)}</span></li>`).join('')}</ul>
        </div>
      </div>`);
    detalle.modal.setFoot(`<a class="btn btn-ghost" href="#/mapa?tramo=${t.id}" data-close>${U.icon('map', 15)} Ver en el mapa</a><div class="grow"></div>${acciones.join('')}`);
    detalle.modal.foot.querySelectorAll('[data-act]').forEach(b => b.onclick = () => accion(b.dataset.act, e.id));
  }

  function accion(act, id) {
    const map = {
      validar: () => Store.validarExpediente(id),
      preview: () => previewIntimacion(id),
      verint: () => previewIntimacion(id),
      notificar: () => Store.notificarIntimacion(id),
      multa: () => Store.aplicarMulta(id),
      pago: () => { const p = Store.registrarPago(id); if (p) U.toast(`Pago ${p.id} registrado: ${U.money(p.monto)}`, 'ok'); },
      retiro: () => Store.ordenarRetiro(id),
      'confirmar-retiro': () => Store.confirmarRetiro(id),
    };
    map[act] && map[act]();
  }

  // ---------- Intimación (documento imprimible) ----------
  function intimacionHTML(id) {
    const e = Store.exp(id), t = Store.tramo(e.tramoId), p = Store.prov(e.prov), M = Store.CFG.municipio;
    const l = Store.liquidacion(e), ev = Store.state.evidencias.find(v => v.id === e.evidenciaId);
    const numero = e.intimacion?.numero || `${Store.state.hoy.slice(0, 4)}-BORRADOR`;
    const fecha = e.intimacion?.fecha || Store.state.hoy;
    const plazoHasta = e.etapa >= 3 && e.vence ? e.vence : U.addDays(fecha, 30);
    return `
      <article class="doc">
        <div class="doc-demo">Documento de demostración · datos simulados · sin validez legal</div>
        <header class="doc-head">
          <div class="doc-escudo">${U.icon('shield', 34)}</div>
          <div><b>${U.esc(M.nombre)}</b><br>${U.esc(M.area)}<br><span class="small">${U.esc(M.domicilio)}</span></div>
          <div class="doc-num"><b>CÉDULA DE INTIMACIÓN</b><br>N° ${numero}<br>Expte. ${e.id}<br>${U.fmtDate(fecha)}</div>
        </header>
        <p><b>Sres. ${U.esc(p.nombre)}</b> · CUIT ${p.cuit}<br>Domicilio constituido: ${U.esc(p.domicilio)} · ${U.esc(p.email)}</p>
        <p>En virtud de lo dispuesto por la ${U.esc(M.ordenanza)} y el permiso de ocupación <b>${p.permisoMarco}</b>, se hace saber que en el relevamiento
        ${ev ? `de fecha <b>${U.fmtDate(ev.fecha)} a las ${ev.hora}</b> (evidencia <b>${ev.id}</b>, coordenadas ${ev.lat.toFixed(6)}, ${ev.lng.toFixed(6)}, conteo validado por ${U.esc(ev.inspector)})` : `automático de fecha <b>${U.fmtDate(t.ultimoRelevamiento)}</b>`}
        se constató en el tramo <b>${t.id} — ${U.esc(t.calle)} ${t.altura}</b> la existencia de <b>${l.det} cables</b> de su titularidad, cuando el permiso vigente autoriza <b>${l.aut}</b>,
        lo que configura una ocupación no declarada de <b>${l.exc} cables</b>.</p>
        <div class="doc-ev">
          <img src="${U.posteDataURI(t.fotoSeed, l.det)}" alt="Evidencia">
          <table class="table mini">
            <tbody>
              <tr><td>Exceso mensual (${t.largo} m, recargo ${U.num(l.recargo * 100)} %)</td><td class="num">${U.money(l.excesoMes)}</td></tr>
              <tr><td>Cobro retroactivo (${l.meses} meses)</td><td class="num">${U.money(l.retro)}</td></tr>
              <tr><td>Intereses por mora</td><td class="num">${U.money(l.interes)}</td></tr>
              <tr><td>Multa (${l.exc} × ${U.money(Store.state.params.multaPorCable)})</td><td class="num">${U.money(l.multa)}</td></tr>
              <tr class="total"><td>Total intimado</td><td class="num">${U.money(l.total)}</td></tr>
            </tbody>
          </table>
        </div>
        <p>Por ello, <b>SE LO INTIMA</b> para que dentro del plazo de <b>treinta (30) días corridos</b> (hasta el <b>${U.fmtDate(plazoHasta)}</b>) proceda a:
        a) declarar bajo juramento la totalidad de los cables instalados y solicitar la ampliación del permiso; y b) abonar la liquidación precedente;
        <b>bajo apercibimiento</b> de aplicar la multa prevista y ordenar el <b>retiro de los cables a su exclusivo costo</b>, con ejecución de la garantía del permiso.</p>
        ${Store.state.amnistia.activa ? `<p class="doc-note">Régimen de regularización voluntaria vigente hasta el ${U.fmtDate(Store.state.amnistia.hasta)}: si declara dentro de dicho plazo, se condonan la multa, el recargo y los intereses (abonaría ${U.money(Store.calcCargos(t, Store.ocup(t, e.prov), Store.state.params, { amnistia: true }).total)}).</p>` : ''}
        <footer class="doc-foot">
          <div class="doc-qr">${U.qrSVG(numero + e.id, 76)}<span class="small">Verificar autenticidad<br>y evidencia digital</span></div>
          <div class="doc-firma">${U.esc(Store.CFG.usuarios.legal)}<br><span class="small">Dirección de Asuntos Legales · firma digital</span></div>
        </footer>
      </article>`;
  }

  function previewIntimacion(id) {
    const e = Store.exp(id);
    const borrador = e.etapa === 1 && e.abierto;
    const m = U.modal({ title: borrador ? 'Vista previa de la intimación' : `Intimación ${e.intimacion?.numero || ''}`, size: 'lg', body: intimacionHTML(id) });
    m.setFoot(`<button class="btn" id="i-print">${U.icon('print', 15)} Imprimir / guardar PDF</button><div class="grow"></div>
      ${borrador ? `<button class="btn btn-primary" id="i-emitir" ${Store.can('intimar') ? '' : 'disabled'}>${U.icon('check', 15)} Emitir y notificar</button>` : ''}`);
    m.foot.querySelector('#i-print').onclick = () => U.printHTML(intimacionHTML(id));
    const em = m.foot.querySelector('#i-emitir');
    if (em) em.onclick = () => { emitir(id); m.close(); };
    return m;
  }

  /** Emite la intimación y registra la notificación (inicia el plazo de 30 días) */
  function emitir(id) {
    Store.emitirIntimacion(id);
    if (Store.exp(id).etapa === 2) {
      Store.notificarIntimacion(id);
      U.toast(`Intimación ${Store.exp(id).intimacion.numero} emitida y notificada. Plazo hasta ${U.fmtDate(Store.exp(id).vence)}.`, 'ok');
    }
  }

  function refresh() {
    if (root && root.isConnected) render(root);
    if (detalle) { if (detalle.modal.el.isConnected) renderDetail(); else detalle = null; }
  }

  return { render, refresh, openDetail, previewIntimacion, intimacionHTML, emitir, plazoBadge, destroy: () => { if (detalle) { detalle.modal.close(); detalle = null; } } };
})();

</script>
  <script>/* js/views/portal.js */
/*
 * 7. PORTAL DEL PROVEEDOR
 * Login simulado. El proveedor ve sólo sus datos: tramos, declaración
 * jurada, solicitudes de permiso con plano "as built", deudas, boletas
 * de pago e intimaciones.
 */
const PortalView = (() => {
  let root = null, tab = 'resumen';
  const djValores = {};   // valores tipeados en la declaración jurada (se conservan entre refrescos)

  const TABS = [
    ['resumen', 'Resumen'], ['tramos', 'Mis tramos'], ['dj', 'Declaración jurada'],
    ['permisos', 'Permisos'], ['deudas', 'Deudas y pagos'], ['intimaciones', 'Intimaciones'],
  ];

  function render(el) {
    root = el;
    const s = Store.state.session;
    if (s.role !== 'proveedor' || !s.provId) return renderLogin();
    const p = Store.prov(s.provId);
    root.innerHTML = `
      <div class="portal-head">
        <div class="portal-brand"><span class="dot big" style="background:${p.color}"></span>
          <div><div class="eyebrow">Portal de proveedores · ${U.esc(Store.CFG.municipio.nombre)}</div><h1>${U.esc(p.nombre)}</h1><div class="muted small">CUIT ${p.cuit} · ${U.esc(p.representante)}</div></div></div>
        <button class="btn" id="p-logout">${U.icon('logout', 15)} Salir</button>
      </div>
      ${Store.state.amnistia.activa ? `<div class="callout ok banner">${U.icon('shield', 16)} <span><b>Régimen de regularización voluntaria vigente hasta el ${U.fmtDate(Store.state.amnistia.hasta)}.</b> Declare lo realmente instalado y regularice sin multas, recargos ni intereses.</span></div>` : ''}
      <div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
      <div id="portal-body"></div>`;
    root.querySelector('#p-logout').onclick = () => { Store.logout(); location.hash = '#/dashboard'; };
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
    renderTab();
  }

  function renderLogin() {
    const C = Store.CFG;
    root.innerHTML = `
      <div class="login-wrap">
        <div class="card login">
          <div class="login-logo">${U.icon('building', 30)}</div>
          <h1>Portal de proveedores</h1>
          <p class="muted">${U.esc(C.municipio.nombre)} · Ocupación de postes y ductos</p>
          <label class="field"><span>Empresa</span><select id="l-prov">${C.proveedores.map(p => `<option value="${p.id}">${U.esc(p.nombre)}</option>`).join('')}</select></label>
          <label class="field"><span>CUIT</span><input id="l-cuit" value="${C.proveedores[0].cuit}" readonly></label>
          <label class="field"><span>Clave fiscal municipal</span><input type="password" value="demo-demo" readonly></label>
          <button class="btn btn-primary block" id="l-go">${U.icon('lock', 15)} Ingresar</button>
          <p class="muted small center">Acceso simulado para la demostración.</p>
        </div>
      </div>`;
    const sel = root.querySelector('#l-prov');
    sel.onchange = () => { root.querySelector('#l-cuit').value = Store.prov(sel.value).cuit; };
    root.querySelector('#l-go').onclick = () => login(sel.value);
  }

  function login(provId) { tab = 'resumen'; Store.loginProveedor(provId); }
  function setTab(k) { tab = k; if (root) render(root); }

  // ---------- Datos del proveedor ----------
  function misTramos() {
    const id = Store.state.session.provId;
    return Store.state.tramos.filter(t => Store.ocup(t, id)).map(t => {
      const o = Store.ocup(t, id);
      return { t, o, exc: t.relevado ? Math.max(0, o.detectados - o.autorizados) : 0, exp: Store.expedienteDe(t.id, id) };
    }).sort((a, b) => b.exc - a.exc || a.t.id.localeCompare(b.t.id));
  }
  function misExp(abiertos = true) { const id = Store.state.session.provId; return Store.state.expedientes.filter(e => e.prov === id && (abiertos ? e.abierto : true)); }

  function renderTab() {
    const body = root.querySelector('#portal-body');
    const id = Store.state.session.provId, p = Store.prov(id);
    const tr = misTramos(), exps = misExp();
    const deuda = exps.reduce((a, e) => a + Store.liquidacion(e).total, 0);
    const canon = Store.totals().porProvMes[id] || 0;
    const mes = Store.state.hoy.slice(0, 7);
    const canonPagado = !!Store.state.canonPagado[id + ':' + mes];

    if (tab === 'resumen') {
      body.innerHTML = `
        <section class="kpi-grid kpi-4">
          <div class="card kpi"><div class="kpi-label">Tramos con permiso</div><div class="kpi-value">${tr.length}</div><div class="kpi-sub">${tr.reduce((a, x) => a + x.o.autorizados, 0)} cables autorizados</div></div>
          <div class="card kpi ${tr.some(x => x.exc) ? 'kpi-alert' : ''}"><div class="kpi-label">Tramos con diferencias</div><div class="kpi-value ${tr.some(x => x.exc) ? 't-crit' : ''}">${tr.filter(x => x.exc).length}</div><div class="kpi-sub">${tr.reduce((a, x) => a + x.exc, 0)} cables detectados sin declarar</div></div>
          <div class="card kpi"><div class="kpi-label">Deuda por expedientes</div><div class="kpi-value">${U.moneyShort(deuda)}</div><div class="kpi-sub">${exps.length} expedientes abiertos</div></div>
          <div class="card kpi"><div class="kpi-label">Canon del mes</div><div class="kpi-value">${U.moneyShort(canon)}</div><div class="kpi-sub">${canonPagado ? 'Pagado' : `Vence el 10/${mes.slice(5, 7)}`}</div></div>
        </section>
        <div class="card"><h3>Próximos pasos</h3>
          <ul class="todo">
            ${tr.some(x => x.exc) ? `<li>${U.icon('alert', 15)} El municipio detectó cables sin declarar en ${tr.filter(x => x.exc).length} tramos. <a href="#" data-goto="dj">Presentar declaración jurada →</a></li>` : `<li>${U.icon('check', 15)} No hay diferencias entre lo autorizado y lo relevado.</li>`}
            ${exps.filter(e => e.intimacion).length ? `<li>${U.icon('file', 15)} Tiene ${exps.filter(e => e.intimacion).length} intimaciones pendientes. <a href="#" data-goto="intimaciones">Ver intimaciones →</a></li>` : ''}
            <li>${U.icon('money', 15)} ${canonPagado ? 'Canon del mes abonado.' : `Canon del mes: ${U.money(canon)}. <a href="#" data-goto="deudas">Pagar →</a>`}</li>
            <li>${U.icon('upload', 15)} ¿Va a tender nuevos cables? <a href="#" data-goto="permisos">Solicite el permiso con su plano as built →</a></li>
          </ul></div>`;
    }

    if (tab === 'tramos') {
      body.innerHTML = `<div class="card"><div class="table-wrap"><table class="table">
        <thead><tr><th>Tramo</th><th>Ubicación</th><th>Tipo</th><th class="num">Autorizados</th><th class="num">Relevados por el municipio</th><th>Estado</th><th>Expediente</th></tr></thead>
        <tbody>${tr.map(({ t, o, exc, exp }) => `<tr>
          <td><b>${t.id}</b></td><td>${U.esc(t.calle)} ${t.altura}</td><td>${t.tipo}</td><td class="num">${o.autorizados}</td>
          <td class="num">${t.relevado ? o.detectados : '—'}</td>
          <td>${!t.relevado ? U.badgeEstado('sin') : exc ? `<span class="badge b-crit">${U.icon('alert', 12)}+${exc} sin declarar</span>` : U.badgeEstado('cumple')}</td>
          <td>${exp ? `${exp.id} · ${Store.ETAPAS[exp.etapa]}` : '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
    }

    if (tab === 'dj') {
      const lista = tr.filter(x => x.t.relevado);
      body.innerHTML = `<div class="card" id="portal-dj">
        <div class="card-head"><h3>Declaración jurada de cables instalados</h3><span class="muted small">Ordenada por diferencias detectadas</span></div>
        <p class="muted small">Indique la cantidad real de cables instalados por tramo. Al declarar más que lo autorizado se amplía el permiso y se regulariza el expediente${Store.state.amnistia.activa ? ', <b>sin multa</b> mientras rija el régimen voluntario' : ''}.</p>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Tramo</th><th>Ubicación</th><th class="num">Autorizados</th><th class="num">Relevados</th><th>Cables instalados (declarados)</th></tr></thead>
          <tbody>${lista.map(({ t, o, exc }) => `<tr class="${exc ? 'row-warn' : ''}">
            <td><b>${t.id}</b></td><td>${U.esc(t.calle)} ${t.altura}</td><td class="num">${o.autorizados}</td>
            <td class="num">${o.detectados}${exc ? ` <span class="badge b-crit">+${exc}</span>` : ''}</td>
            <td><input type="number" min="0" class="dj-input" data-tramo="${t.id}" value="${djValores[t.id] ?? o.autorizados}" aria-label="Cables instalados en ${t.id}"></td></tr>`).join('')}</tbody>
        </table></div>
        <label class="check mt"><input type="checkbox" id="dj-jura"> Declaro bajo juramento que los datos consignados son correctos y completos.</label>
        <div class="btn-row mt"><button class="btn btn-primary" id="dj-enviar">${U.icon('file', 15)} Presentar declaración jurada</button></div>
      </div>
      ${Store.state.declaraciones.filter(d => d.provId === id).length ? `<div class="card"><h3>Declaraciones presentadas</h3><ul class="todo">${Store.state.declaraciones.filter(d => d.provId === id).reverse().map(d => `<li>${U.icon('file', 15)} <b>${d.id}</b> · ${U.fmtDate(d.fecha)} ${d.hora.slice(0, 5)} · ${d.resultados.length} tramo(s) · ${d.resultados.filter(r => r.resultado === 'regularizado').length} regularizados</li>`).join('')}</ul></div>` : ''}`;
      body.querySelectorAll('.dj-input').forEach(i => i.oninput = () => { djValores[i.dataset.tramo] = +i.value; });
      body.querySelector('#dj-enviar').onclick = () => submitDJ();
    }

    if (tab === 'permisos') {
      const pers = Store.state.permisos.filter(x => x.provId === id).reverse();
      body.innerHTML = `<div class="grid-2">
        <div class="card"><h3>Solicitar nuevo permiso</h3>
          <label class="field"><span>Tramos (separados por coma)</span><input id="pe-tramos" placeholder="Ej: T-0101, T-0102"></label>
          <div class="form-row"><label class="field"><span>Cables por tramo</span><input id="pe-cables" type="number" min="1" value="2"></label>
          <label class="field"><span>Tipo</span><select id="pe-tipo"><option>Aéreo en postes</option><option>Ducto subterráneo</option></select></label></div>
          <label class="field"><span>Plano "as built" (PDF / DWG)</span><input id="pe-file" type="file" accept=".pdf,.dwg,.dxf,image/*"></label>
          <button class="btn btn-primary mt" id="pe-enviar">${U.icon('upload', 15)} Enviar solicitud</button>
        </div>
        <div class="card"><h3>Mis solicitudes</h3>
          ${pers.length ? `<table class="table"><thead><tr><th>Solicitud</th><th>Tramos</th><th class="num">Cables</th><th>Estado</th></tr></thead><tbody>${pers.map(x => `<tr><td><b>${x.id}</b><br><span class="small muted">${U.fmtDate(x.fecha)}</span></td><td>${U.esc(x.tramos)}</td><td class="num">${x.cables}</td><td><span class="badge b-info">${x.estado}</span></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Todavía no presentó solicitudes.</p>'}
          <p class="muted small">Permiso marco vigente: <b>${p.permisoMarco}</b></p>
        </div></div>`;
      body.querySelector('#pe-enviar').onclick = () => {
        const tramos = body.querySelector('#pe-tramos').value.trim();
        if (!tramos) { U.toast('Indique al menos un tramo.', 'error'); return; }
        const f = body.querySelector('#pe-file').files[0];
        const per = Store.solicitarPermiso(id, { tramos, cables: +body.querySelector('#pe-cables').value, tipo: body.querySelector('#pe-tipo').value, archivo: f ? f.name : null });
        U.toast(`Solicitud ${per.id} enviada. Estado: en evaluación técnica.`, 'ok');
      };
    }

    if (tab === 'deudas') {
      const pagos = Store.state.pagos.filter(x => x.provId === id).reverse();
      body.innerHTML = `<div class="card" id="portal-deudas">
        <div class="card-head"><h3>Deudas pendientes</h3><b>${U.money(deuda + (canonPagado ? 0 : canon))}</b></div>
        <div class="table-wrap"><table class="table">
