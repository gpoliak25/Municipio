          <thead><tr><th>Concepto</th><th>Detalle</th><th>Vencimiento</th><th class="num">Importe</th><th></th></tr></thead>
          <tbody>
            ${canonPagado ? '' : `<tr><td><b>Canon de ocupación ${U.monthLabel(Store.state.hoy)}</b></td><td>${tr.length} tramos · ${tr.reduce((a, x) => a + x.o.autorizados, 0)} cables autorizados</td><td>10/${mes.slice(5, 7)}/${mes.slice(0, 4)}</td><td class="num">${U.money(canon)}</td><td><button class="btn btn-sm" data-boleta="canon">Boleta</button></td></tr>`}
            ${exps.map(e => { const l = Store.liquidacion(e); return `<tr><td><b>${e.id}</b><br><span class="small muted">${Store.ETAPAS[e.etapa]}${e.regularizacion?.tipo === 'voluntaria' ? ' · regularización voluntaria' : ''}</span></td>
              <td>${e.tramoId} · ${l.exc} cables · retro ${U.moneyShort(l.retro)}${l.multa ? ` · multa ${U.moneyShort(l.multa)}` : ''}</td>
              <td>${e.vence ? U.fmtDate(e.vence) : '—'}</td><td class="num"><b>${U.money(l.total)}</b></td>
              <td><button class="btn btn-sm btn-primary" data-boleta="${e.id}">Boleta / pagar</button></td></tr>`; }).join('')}
            ${!exps.length && canonPagado ? '<tr><td colspan="5" class="muted">No registra deudas.</td></tr>' : ''}
          </tbody></table></div>
      </div>
      <div class="card"><h3>Pagos realizados</h3>${pagos.length ? `<table class="table"><thead><tr><th>Pago</th><th>Concepto</th><th>Fecha</th><th class="num">Importe</th></tr></thead><tbody>${pagos.map(x => `<tr><td><b>${x.id}</b></td><td>${U.esc(x.concepto)}</td><td>${U.fmtDate(x.fecha)}</td><td class="num">${U.money(x.monto)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Sin pagos registrados en esta sesión.</p>'}</div>`;
      body.querySelectorAll('[data-boleta]').forEach(b => b.onclick = () => openBoleta(b.dataset.boleta));
    }

    if (tab === 'intimaciones') {
      const ints = misExp(false).filter(e => e.intimacion).reverse();
      body.innerHTML = `<div class="card"><div class="table-wrap"><table class="table">
        <thead><tr><th>Intimación</th><th>Expediente</th><th>Tramo</th><th>Fecha</th><th>Plazo</th><th></th></tr></thead>
        <tbody>${ints.map(e => `<tr><td><b>${e.intimacion.numero}</b></td><td>${e.id}</td><td>${e.tramoId}</td><td>${U.fmtDate(e.intimacion.fecha)}</td><td>${ExpedientesView.plazoBadge(e)}</td>
          <td><button class="btn btn-sm" data-int="${e.id}">${U.icon('file', 14)} Ver / descargar</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No tiene intimaciones.</td></tr>'}</tbody></table></div></div>`;
      body.querySelectorAll('[data-int]').forEach(b => b.onclick = () => ExpedientesView.previewIntimacion(b.dataset.int));
    }

    body.querySelectorAll('[data-goto]').forEach(a => a.onclick = ev => { ev.preventDefault(); setTab(a.dataset.goto); });
  }

  // ---------- Declaración jurada ----------
  function submitDJ(confirmado) {
    const id = Store.state.session.provId;
    const jura = root.querySelector('#dj-jura');
    if (!confirmado && jura && !jura.checked) { U.toast('Debe marcar la declaración bajo juramento.', 'error'); return null; }
    // Se declaran sólo los tramos que el proveedor modificó
    const items = misTramos().filter(x => x.t.relevado && djValores[x.t.id] != null && djValores[x.t.id] !== x.o.autorizados)
      .map(({ t }) => ({ tramoId: t.id, instalados: djValores[t.id] }));
    if (!items.length) { U.toast('No hay cambios para declarar.', 'error'); return null; }
    const dj = Store.declararDJ(id, items);
    if (!dj) return null;
    items.forEach(it => delete djValores[it.tramoId]);
    const RES = { regularizado: 'b-ok', inconsistente: 'b-crit', 'sin-cambios': 'b-none' };
    const m = U.modal({
      title: `Declaración jurada ${dj.id} presentada`, size: 'md',
      body: `<p class="muted">Fecha ${U.fmtDate(dj.fecha)} ${dj.hora} · Constancia con validez de declaración jurada.</p>
        <table class="table"><thead><tr><th>Tramo</th><th class="num">Declarados</th><th>Resultado</th></tr></thead>
        <tbody>${dj.resultados.map(r => `<tr><td><b>${r.tramoId}</b></td><td class="num">${r.instalados}</td><td><span class="badge ${RES[r.resultado]}">${r.resultado}</span> <span class="small">${U.esc(r.texto)}</span></td></tr>`).join('')}</tbody></table>`,
      footer: `<button class="btn btn-primary" data-close id="dj-ok">Ver deudas a pagar</button>`,
    });
    m.foot.querySelector('#dj-ok').onclick = () => setTab('deudas');
    return dj;
  }
  /** Completa un valor de la DJ (usado por la demo guiada) */
  function fillDJ(tramoId, valor) {
    djValores[tramoId] = valor;
    const i = root && root.querySelector(`.dj-input[data-tramo="${tramoId}"]`);
    if (i) { i.value = valor; i.classList.add('flash'); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    const j = root && root.querySelector('#dj-jura'); if (j) j.checked = true;
  }

  // ---------- Boleta de pago ----------
  function openBoleta(ref) {
    const id = Store.state.session.provId, p = Store.prov(id), M = Store.CFG.municipio;
    const esCanon = ref === 'canon';
    const e = esCanon ? null : Store.exp(ref);
    const monto = esCanon ? (Store.totals().porProvMes[id] || 0) : Store.liquidacion(e).total;
    const concepto = esCanon ? `Canon de ocupación ${U.monthLabel(Store.state.hoy)}` : `Liquidación expediente ${e.id} (${e.tramoId})${e.regularizacion?.tipo === 'voluntaria' ? ' · regularización voluntaria' : ''}`;
    const codigo = `0458${id}${String(Math.round(monto)).padStart(12, '0')}${Store.state.hoy.replace(/-/g, '')}`;
    const venc = esCanon ? `${Store.state.hoy.slice(0, 8)}10` : (e.vence || U.addDays(Store.state.hoy, 15));
    const doc = `<article class="doc boleta">
        <div class="doc-demo">Documento de demostración · datos simulados · sin validez legal</div><header class="doc-head"><div class="doc-escudo">${U.icon('shield', 30)}</div><div><b>${U.esc(M.nombre)}</b><br>Boleta de pago · Tasa por ocupación del espacio público</div><div class="doc-num">Vto. ${U.fmtDate(venc)}</div></header>
        <dl class="kv"><dt>Contribuyente</dt><dd>${U.esc(p.nombre)} · CUIT ${p.cuit}</dd><dt>Concepto</dt><dd>${U.esc(concepto)}</dd><dt class="strong">Importe</dt><dd class="strong">${U.money(monto)}</dd></dl>
        <div class="barcode">${U.barcodeSVG(codigo)}<code>${codigo}</code></div>
        <p class="small muted">Pagable en bancos adheridos, Pago Fácil, Rapipago, home banking o con QR. Demo: sin validez fiscal.</p>
      </article>`;
    const m = U.modal({ title: 'Boleta de pago', size: 'md', body: doc });
    m.setFoot(`<button class="btn" id="b-print">${U.icon('print', 15)} Descargar / imprimir</button><div class="grow"></div><button class="btn btn-primary" id="b-pay">${U.icon('money', 15)} Pagar ahora (simulado)</button>`);
    m.foot.querySelector('#b-print').onclick = () => U.printHTML(doc);
    m.foot.querySelector('#b-pay').onclick = () => pagar(ref, m);
    return m;
  }
  function pagar(ref, m) {
    const id = Store.state.session.provId;
    if (ref === 'canon') { Store.pagarCanon(id); U.toast('Canon abonado. ¡Gracias!', 'ok'); }
    else { const pg = Store.registrarPago(ref); if (pg) U.toast(`Pago ${pg.id} acreditado: ${U.money(pg.monto)}. Expediente cerrado.`, 'ok'); }
    if (m) m.close();
  }

  function refresh() { if (root && root.isConnected) render(root); }

  return { render, refresh, login, setTab, fillDJ, submitDJ, openBoleta, pagar };
})();

</script>
  <script>/* js/views/auditoria.js */
/*
 * 8. AUDITORÍA Y TRAZABILIDAD
 * Log encadenado (cada registro contiene el hash del anterior: si alguien
 * altera uno, la cadena se rompe) y matriz de roles y permisos.
 */
const AuditoriaView = (() => {
  let root = null, filtroRol = '', q = '', limite = 60;

  const ROL_LABEL = r => r === 'sistema' ? 'Sistema' : (Store.ROLES[r]?.nombre || r);

  function render(el) {
    root = el;
    const S = Store.state;
    const puede = Store.can('auditoria');
    root.innerHTML = `
      <div class="page-head">
        <div><h1>Auditoría y trazabilidad</h1>
        <p class="muted">Quién hizo qué y cuándo. Los registros no se pueden editar ni borrar: cada uno se encadena con el anterior mediante una huella digital.</p></div>
      </div>
      <div class="grid-2 audit-top">
        <div class="card integrity" id="aud-integridad">
          <div class="int-icon">${U.icon('shield', 30)}</div>
          <div class="grow">
            <h3>Integridad del registro</h3>
            <p id="aud-res" class="muted">${S.audit.length} registros encadenados. Último hash: <code>${S.audit[S.audit.length - 1].hash}</code></p>
            <div class="btn-row"><button class="btn btn-primary btn-sm" id="aud-ver">Verificar cadena completa</button><button class="btn btn-sm" id="aud-tamper">Simular alteración de un registro</button></div>
          </div>
        </div>
        <div class="card">
          <h3>Sesión actual</h3>
          <dl class="kv"><dt>Usuario</dt><dd>${U.esc(Store.usuarioActual())}</dd><dt>Rol</dt><dd>${ROL_LABEL(S.session.role)}</dd>
          <dt>Permisos</dt><dd>${Store.ROLES[S.session.role].perms.map(p => `<span class="badge b-info">${Store.PERMISOS[p]}</span>`).join(' ')}</dd></dl>
          <p class="muted small">Cambie de rol desde la barra superior para ver cómo se habilitan o bloquean las acciones.</p>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Matriz de roles y permisos</h3></div>
        <div class="table-wrap"><table class="table matrix">
          <thead><tr><th>Permiso</th>${Object.entries(Store.ROLES).map(([k, r]) => `<th class="center ${k === S.session.role ? 'col-sel' : ''}">${r.nombre}</th>`).join('')}</tr></thead>
          <tbody>${Object.entries(Store.PERMISOS).map(([pk, pl]) => `<tr><td>${pl}</td>${Object.entries(Store.ROLES).map(([k, r]) => `<td class="center ${k === S.session.role ? 'col-sel' : ''}">${r.perms.includes(pk) ? `<span class="t-ok">${U.icon('check', 16)}</span>` : '<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Registro de acciones</h3>
          <div class="filters-inline">
            <select id="aud-rol" aria-label="Filtrar por rol"><option value="">Todos los roles</option>${['sistema', ...Object.keys(Store.ROLES)].map(r => `<option value="${r}" ${filtroRol === r ? 'selected' : ''}>${ROL_LABEL(r)}</option>`).join('')}</select>
            <input type="search" id="aud-q" placeholder="Buscar acción, objeto o usuario" value="${U.esc(q)}">
          </div>
        </div>
        ${puede ? '<div class="table-wrap" id="aud-tabla"></div>' : `<p class="callout info">${U.icon('lock', 15)} Su rol no tiene acceso al registro completo de auditoría. Disponible para Administrador, Hacienda y Legal.</p>`}
      </div>`;

    root.querySelector('#aud-ver').onclick = () => {
      const r = Store.verifyChain();
      showResult(r, Store.state.audit);
    };
    root.querySelector('#aud-tamper').onclick = () => {
      // Se altera una COPIA (el registro real no se modifica)
      const copia = Store.state.audit.map(x => ({ ...x }));
      const i = Math.floor(copia.length * 0.4);
      copia[i].detalle = copia[i].detalle.replace(/\d+/, d => String(+d + 1)) + ' ';
      showResult(Store.verifyChain(copia), copia, i);
    };
    const rs = root.querySelector('#aud-rol'); rs.onchange = () => { filtroRol = rs.value; renderTabla(); };
    const qi = root.querySelector('#aud-q'); qi.oninput = () => { q = qi.value.trim().toLowerCase(); renderTabla(); };
    if (puede) renderTabla();
  }

  function showResult(r, list, alterado) {
    const el = root.querySelector('#aud-res');
    const box = root.querySelector('#aud-integridad');
    box.classList.toggle('bad', !r.ok); box.classList.toggle('good', r.ok);
    el.innerHTML = r.ok
      ? `<b class="t-ok">${U.icon('check', 15)} Cadena íntegra.</b> Se verificaron ${list.length} registros: ninguno fue alterado.`
      : `<b class="t-crit">${U.icon('alert', 15)} Cadena rota en el registro #${list[r.index].n}.</b> ${alterado != null ? 'Simulación: se cambió un dígito en el detalle de un registro (sobre una copia) y la verificación lo detecta de inmediato.' : ''}`;
  }

  function renderTabla() {
    const el = root.querySelector('#aud-tabla');
    if (!el) return;
    const list = [...Store.state.audit].reverse().filter(a => (!filtroRol || a.rol === filtroRol) && (!q || `${a.accion} ${a.detalle} ${a.objeto} ${a.usuario}`.toLowerCase().includes(q)));
    el.innerHTML = `<table class="table">
      <thead><tr><th>#</th><th>Fecha y hora</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Detalle</th><th>Objeto</th><th>Hash</th></tr></thead>
      <tbody>${list.slice(0, limite).map(a => `<tr><td class="muted">${a.n}</td><td class="nowrap">${U.fmtDateTime(a.ts)}</td><td>${U.esc(a.usuario)}</td><td><span class="badge b-none">${ROL_LABEL(a.rol)}</span></td>
        <td><b>${U.esc(a.accion)}</b></td><td class="small">${U.esc(a.detalle)}</td><td class="small">${U.esc(a.objeto)}</td><td><code title="Anterior: ${a.prevHash}">${a.hash.slice(0, 10)}…</code></td></tr>`).join('')}</tbody></table>
      ${list.length > limite ? `<div class="center mt"><button class="btn btn-sm" id="aud-mas">Ver más (${list.length - limite} restantes)</button></div>` : ''}`;
    const mas = el.querySelector('#aud-mas'); if (mas) mas.onclick = () => { limite += 100; renderTabla(); };
  }

  return { render, refresh: () => root && root.isConnected && render(root) };
})();

</script>
  <script>/* js/views/planificacion.js */
/*
 * 9. PLANIFICACIÓN A LARGO PLAZO: DUCTO COMPARTIDO / SOTERRAMIENTO
 * Para cada zona estima longitud, densidad de cables, costo de obra e
 * ingreso por alquiler de "capacidad" (subductos) a los proveedores.
 */
const PlanificacionView = (() => {
  let root = null, map = null, layer = null, P = null;

  function destroy() { if (map) { map.remove(); map = null; } }

  /** Métricas por zona según los parámetros del escenario */
  function analisis() {
    const zonas = Store.CFG.zonas.map(z => {
      const ts = Store.state.tramos.filter(t => t.zona === z.id);
      const km = ts.reduce((a, t) => a + t.largo, 0) / 1000;
      const cables = ts.reduce((a, t) => { const m = Store.metrics(t); return a + (m.det ?? m.aut); }, 0);
      const exceso = ts.reduce((a, t) => a + (Store.metrics(t).exceso || 0), 0);
      const aut = ts.reduce((a, t) => a + Store.metrics(t).aut, 0);
      const provs = new Set(ts.flatMap(t => t.ocupaciones.map(o => o.prov))).size;
      const postes = ts.filter(t => t.tipo === 'poste').length;
      return { z, ts, km, cables, exceso, aut, provs, postes, densidad: km ? cables / km : 0 };
    });
    const maxDens = Math.max(...zonas.map(x => x.densidad));
    zonas.forEach(x => {
      x.ocupacion = (P.ocupacionMax / 100) * (0.45 + 0.55 * x.densidad / maxDens);  // más densidad => más subductos alquilados
      x.costo = x.km * P.costoKm;
      x.ingresoAnual = x.km * 1000 * P.subductos * x.ocupacion * P.tarifaSubductoMetroMes * 12;
      x.payback = x.ingresoAnual ? x.costo / x.ingresoAnual : Infinity;
      x.vpn = x.ingresoAnual * P.horizonte - x.costo;
      x.score = 0.6 * (x.densidad / maxDens) + 0.4 * Math.min(1, (x.aut ? x.exceso / x.aut : 0) / 0.3);
      x.prioridad = x.score > 0.75 ? 'Alta' : x.score > 0.55 ? 'Media' : 'Baja';
    });
    return zonas.sort((a, b) => b.score - a.score);
  }

  function render(el) {
    root = el;
    destroy();
    if (!P) P = { ...Store.CFG.planificacion };
    root.innerHTML = `
      <div class="page-head">
        <div><h1>Planificación: ducto compartido</h1>
        <p class="muted">Propuesta de soterramiento con ducto municipal multiproveedor. El municipio construye la infraestructura y alquila "capacidad" (subductos) a todos los operadores: ordena el espacio aéreo y crea un ingreso estable.</p></div>
      </div>
      <div class="plan-layout">
        <div class="card" id="plan-params">
          <h3>Supuestos del proyecto</h3>
          ${[
            ['costoKm', 'Costo de obra por km (ducto + cámaras)', 50000000, 400000000, 5000000, v => U.moneyShort(v)],
            ['tarifaSubductoMetroMes', 'Alquiler por subducto, por metro y mes', 100, 1500, 25, v => U.money(v)],
            ['subductos', 'Subductos por ducto', 2, 12, 1, v => v],
            ['ocupacionMax', 'Ocupación máxima esperada', 30, 100, 5, v => v + ' %'],
            ['horizonte', 'Horizonte de evaluación (años)', 5, 30, 1, v => v + ' años'],
          ].map(([k, l, mn, mx, st, f]) => `<div class="slider-row"><div class="slider-top"><label for="pp-${k}">${l}</label><b id="pv-${k}">${f(P[k])}</b></div>
            <input type="range" id="pp-${k}" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}"></div>`).join('')}
          <p class="muted small">La ocupación de cada zona escala con su densidad de cables por km.</p>
        </div>
        <div class="card map-wrap"><div id="plan-map" role="region" aria-label="Mapa de zonas candidatas"></div>
          <div class="map-legend"><span><i class="sw" style="background:#d03b3b"></i>Prioridad alta</span><span><i class="sw" style="background:#fab219"></i>Media</span><span><i class="sw" style="background:#2a78d6"></i>Baja</span></div></div>
      </div>
      <div class="card"><div class="card-head"><h3>Zonas candidatas</h3><span class="muted small">Ordenadas por prioridad (densidad de cables y nivel de incumplimiento)</span></div><div class="table-wrap" id="plan-tabla"></div></div>
      <div class="card"><h3>Beneficios adicionales (no monetizados)</h3>
        <ul class="todo">
          <li>${U.icon('check', 15)} Elimina el exceso de cables por diseño: cada subducto se alquila con contrato y se mide.</li>
          <li>${U.icon('check', 15)} Reduce cortes por tormentas, poda y accidentes de tránsito con postes.</li>
          <li>${U.icon('check', 15)} Libera veredas y mejora el paisaje urbano del centro comercial.</li>
          <li>${U.icon('check', 15)} Facilita la llegada de nuevos operadores (más competencia, mejores precios para los vecinos).</li>
        </ul></div>`;

    root.querySelectorAll('input[type=range]').forEach(s => s.oninput = () => {
      P[s.dataset.k] = +s.value;
      const f = { costoKm: v => U.moneyShort(v), tarifaSubductoMetroMes: v => U.money(v), subductos: v => v, ocupacionMax: v => v + ' %', horizonte: v => v + ' años' }[s.dataset.k];
      root.querySelector('#pv-' + s.dataset.k).textContent = f(P[s.dataset.k]);
      update();
    });

    if (window.L) {
      map = L.map('plan-map').fitBounds(L.latLngBounds(Store.state.tramos.flatMap(t => t.coords)).pad(0.12));
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; colaboradores de OpenStreetMap' }).addTo(map);
      layer = L.layerGroup().addTo(map);
      setTimeout(() => map && map.invalidateSize(), 80);
    }
    update();
  }

  function update() {
    const zs = analisis();
    const COL = { Alta: '#d03b3b', Media: '#fab219', Baja: '#2a78d6' };
    if (layer) {
      layer.clearLayers();
      zs.forEach(x => {
        const b = L.latLngBounds(x.ts.flatMap(t => t.coords)).pad(0.06);
        L.rectangle(b, { color: COL[x.prioridad], weight: 2, fillOpacity: 0.16 }).addTo(layer)
          .bindPopup(`<b>${U.esc(x.z.nombre)}</b> · prioridad ${x.prioridad}<br>${U.num(x.km, 1)} km · ${x.cables} cables · ${U.num(x.densidad, 0)} cables/km<br>Costo ${U.moneyShort(x.costo)} · ingreso ${U.moneyShort(x.ingresoAnual)}/año<br>Recupero: ${U.num(x.payback, 1)} años`);
        L.marker(b.getCenter(), { icon: L.divIcon({ className: 'zone-label', html: `${U.esc(x.z.nombre)}<br><b>${x.prioridad}</b>` }) }).addTo(layer);
        x.ts.forEach(t => L.polyline(t.coords, { color: '#3a4656', weight: 2, opacity: 0.5, interactive: false }).addTo(layer));
      });
    }
    const tot = zs.reduce((a, x) => ({ costo: a.costo + x.costo, ing: a.ing + x.ingresoAnual, km: a.km + x.km }), { costo: 0, ing: 0, km: 0 });
    root.querySelector('#plan-tabla').innerHTML = `<table class="table">
      <thead><tr><th>Zona</th><th>Prioridad</th><th class="num">Km</th><th class="num">Cables</th><th class="num">Cables/km</th><th class="num">Exceso</th><th class="num">Costo estimado</th><th class="num">Ingreso anual</th><th class="num">Recupero</th><th class="num">Resultado a ${P.horizonte} años</th></tr></thead>
      <tbody>${zs.map(x => `<tr><td><b>${U.esc(x.z.nombre)}</b><br><span class="small muted">${x.provs} proveedores · ${x.postes} tramos aéreos</span></td>

        <div class="card kpi"><div class="kpi-label">${U.icon('scan', 16)} Tramos analizados</div><div class="kpi-value">${N}</div><div class="kpi-sub">${sinRel.length} sin relevar quedan para el modelo</div></div>
        <div class="card kpi"><div class="kpi-label">${U.icon('chart', 16)} Exceso medio por tramo</div><div class="kpi-value">${U.num(mean(ex), 2)}</div><div class="kpi-sub">IC 95 %: ${U.num(ic95(ex)[0], 2)} a ${U.num(ic95(ex)[1], 2)} cables</div></div>
        <div class="card kpi"><div class="kpi-label">${U.icon('layers', 16)} Regresión: R² ajustado</div><div class="kpi-value">${U.num(fit.r2a, 2)}</div><div class="kpi-sub">${signif.length ? 'Explican: ' + signif.join(', ') : 'Ninguna variable significativa'}</div></div>
        <div class="card kpi"><div class="kpi-label">${U.icon('check', 16)} Mejor modelo en prueba</div><div class="kpi-value an-kpi-txt">${mejor[0].split(' (')[0]}</div><div class="kpi-sub">RMSE ${U.num(mejor[1].rmse, 2)} vs. ${U.num(base.rmse, 2)} de la línea base</div></div>
      </section>

      <h2 class="an-sec"><span>1</span> Estadística descriptiva</h2>
      <div class="card"><div class="table-wrap"><table class="table">
        <thead><tr><th>Variable</th><th class="num">n</th><th class="num">Media</th><th class="num">Mediana</th><th class="num">Desvío</th><th class="num">Mín</th><th class="num">Q1</th><th class="num">Q3</th><th class="num">Máx</th><th class="num">Asimetría</th></tr></thead>
        <tbody>${vars.map(([n, a]) => { const d = desc(a); return `<tr><td class="nowrap">${n}</td><td class="num">${d.n}</td><td class="num">${U.num(d.mean, 2)}</td><td class="num">${U.num(d.med, 1)}</td><td class="num">${U.num(d.sd, 2)}</td><td class="num">${U.num(d.min)}</td><td class="num">${U.num(d.q1, 1)}</td><td class="num">${U.num(d.q3, 1)}</td><td class="num">${U.num(d.max)}</td><td class="num">${U.num(d.skew, 2)}</td></tr>`; }).join('')}</tbody>
      </table></div></div>
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>Distribución del exceso</h3><span class="muted small">Tramos por cables de más (7 = 7 o más)</span></div>
          <div class="chart-box"><canvas id="an-hist" aria-label="Histograma del exceso por tramo"></canvas></div>
          <p class="muted small">Asimetría ${U.num(sk, 2)}: ${sk > 0.5 ? 'cola a la derecha, pocos tramos concentran los excesos grandes.' : 'distribución bastante simétrica.'}</p></div>
        <div class="card"><div class="card-head"><h3>Magnitud del exceso por proveedor</h3><span class="muted small">Caja Q1–Q3 · línea: mediana · punto: media</span></div>
          ${boxSVG(grp.map(g => ({ ...g, ...desc(g.a.filter(v => v > 0).concat(g.a.some(v => v > 0) ? [] : [0])) })))}<p class="muted small">Cables de más en los tramos donde cada proveedor incumple. Pasá el mouse por una caja para ver sus valores.</p></div>
      </div>
      <div class="card"><div class="card-head"><h3>Matriz de correlaciones</h3><span class="muted small">Coeficiente de Pearson</span></div>
        <div class="table-wrap"><table class="table heat-table"><thead><tr><th></th>${hv.map(([, l]) => `<th class="num">${l.split(' (')[0]}</th>`).join('')}</tr></thead>
        <tbody>${hv.map(([a, la]) => `<tr><td class="nowrap"><b>${la.split(' (')[0]}</b></td>${hv.map(([b]) => heat(corr(rows.map(q => a === 'exc' ? q.exc : q[a]), rows.map(q => b === 'exc' ? q.exc : q[b])))).join('')}</tr>`).join('')}</tbody></table></div>
        <p class="muted small">Cuanto más intenso el color, más fuerte la relación lineal. La última fila muestra con qué se asocia el exceso.</p></div>

      <h2 class="an-sec"><span>2</span> Estadística inferencial</h2>
      <div class="grid-2">
        <div class="card"><div class="card-head"><h3>Intervalos de confianza del 95 %</h3><span class="muted small">Exceso medio por proveedor y tramo, en cables</span></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Grupo</th><th class="num">n</th><th class="num">Media</th><th class="num">Desvío</th><th class="num">IC 95 %</th></tr></thead>
          <tbody><tr class="total"><td>Todos</td><td class="num">${ocs.length}</td><td class="num">${U.num(mean(ocs.map(o => o.exc)), 2)}</td><td class="num">${U.num(sd(ocs.map(o => o.exc)), 2)}</td><td class="num nowrap">${ic95(ocs.map(o => o.exc)).map(v => U.num(v, 2)).join(' a ')}</td></tr>
          ${grp.map(g => `<tr><td class="nowrap"><i class="dot" style="background:${g.color}"></i>${U.esc(g.name)}</td><td class="num">${g.n}</td><td class="num">${U.num(g.mean, 2)}</td><td class="num">${U.num(g.sd, 2)}</td><td class="num nowrap">${ic95(g.a).map(v => U.num(v, 2)).join(' a ')}</td></tr>`).join('')}</tbody></table></div></div>
        <div class="card"><div class="card-head"><h3>Comparar dos proveedores</h3><span class="muted small">Prueba t de Welch</span></div>
          <div class="an-sel">
            <label class="field"><span>Proveedor A</span><select id="an-a">${provs.map(p => `<option value="${p.id}" ${p.id === cmp.a ? 'selected' : ''}>${U.esc(p.corto)}</option>`).join('')}</select></label>
            <label class="field"><span>Proveedor B</span><select id="an-b">${provs.filter(p => p.id !== cmp.a).map(p => `<option value="${p.id}" ${p.id === cmp.b ? 'selected' : ''}>${U.esc(p.corto)}</option>`).join('')}</select></label>
          </div>
          <dl class="an-kv">
            <dt>Diferencia de medias</dt><dd>${U.num(w.diff, 2)} cables</dd>
            <dt>IC 95 % de la diferencia</dt><dd>${U.num(w.ci[0], 2)} a ${U.num(w.ci[1], 2)}</dd>
            <dt>Estadístico t (gl)</dt><dd>${U.num(w.t, 2)} (${U.num(w.df, 1)})</dd>
            <dt>Valor p</dt><dd>${fp(w.p)}</dd>
            <dt>d de Cohen</dt><dd>${U.num(w.d, 2)}</dd>
          </dl>
          <div class="callout ${w.p < 0.05 ? 'warn' : 'ok'}">${U.icon(w.p < 0.05 ? 'alert' : 'check', 16)}<div>${w.p < 0.05 ? `La diferencia es estadísticamente significativa al 5 %: ${U.esc(w.diff > 0 ? gA.name : gB.name)} excede más.` : 'No hay evidencia suficiente de diferencia al 5 %.'} Tamaño del efecto ${Math.abs(w.d) < 0.3 ? 'pequeño' : Math.abs(w.d) < 0.6 ? 'moderado' : 'grande'}: reportarlo evita confundir significancia con importancia práctica.</div></div></div>
      </div>
      <div class="card"><div class="card-head"><h3>Independencia entre proveedor y cumplimiento</h3><span class="muted small">Prueba chi-cuadrado</span></div>
        <div class="an-chi">
          <div class="table-wrap"><table class="table"><thead><tr><th>Proveedor</th><th class="num">Cumple</th><th class="num">Con exceso</th><th class="num">% con exceso</th></tr></thead>
          <tbody>${grp.map((g, i) => `<tr><td class="nowrap"><i class="dot" style="background:${g.color}"></i>${U.esc(g.name)}</td><td class="num">${obs[i][0]}</td><td class="num">${obs[i][1]}</td><td class="num">${U.pct(obs[i][1] / Math.max(1, obs[i][0] + obs[i][1]), 1)}</td></tr>`).join('')}</tbody></table></div>
          <div><dl class="an-kv"><dt>χ²</dt><dd>${U.num(chi, 2)}</dd><dt>Grados de libertad</dt><dd>${glChi}</dd><dt>Valor p</dt><dd>${fp(pChi)}</dd><dt>V de Cramér</dt><dd>${U.num(cramer, 2)}</dd></dl>
          <p class="muted small">${pChi < 0.05 ? 'El cumplimiento <b>no es independiente</b> del proveedor: algunos incumplen sistemáticamente más que otros.' : 'No se detecta asociación entre proveedor y cumplimiento.'}</p></div>
        </div></div>

      <h2 class="an-sec"><span>3</span> Regresión lineal múltiple</h2>
      <div class="card"><p class="muted small an-top">Variable explicada: exceso del tramo, en cables. n = ${fit.n} · R² = ${U.num(fit.r2, 3)} · R² ajustado = ${U.num(fit.r2a, 3)} · RMSE = ${U.num(fit.rmse, 2)} cables.</p>
        <div class="table-wrap"><table class="table"><thead><tr><th>Variable</th><th class="num">Coeficiente</th><th class="num">Error estándar</th><th class="num">t</th><th class="num">Valor p</th><th class="num">Beta estandarizado</th><th class="num">VIF</th></tr></thead>
        <tbody><tr><td>Constante</td><td class="num">${U.num(fit.b[0], 3)}</td><td class="num">${U.num(fit.se[0], 3)}</td><td class="num">${U.num(fit.t[0], 2)}</td><td class="num">${fp(fit.p[0])}</td><td class="num">—</td><td class="num">—</td></tr>
        ${VARS.map(([, l], j) => `<tr class="${fit.p[j + 1] < 0.05 ? 'an-sig' : ''}"><td class="nowrap">${l}</td><td class="num">${U.num(fit.b[j + 1], 3)}</td><td class="num">${U.num(fit.se[j + 1], 3)}</td><td class="num">${U.num(fit.t[j + 1], 2)}</td><td class="num">${fp(fit.p[j + 1])} <b>${estrellas(fit.p[j + 1])}</b></td><td class="num">${U.num(fit.b[j + 1] * sd(X.map(x => x[j])) / sy, 2)}</td><td class="num">${U.num(Ri[j][j], 2)}</td></tr>`).join('')}</tbody></table></div>
        <p class="muted small">* p &lt; 0,05 · ** p &lt; 0,01 · *** p &lt; 0,001. Las filas resaltadas son significativas.</p>
        <div class="grid-2 an-res">
          <div><h4>Residuos <span class="muted small">media ${U.num(mean(fit.res), 3)} · desvío ${U.num(sd(fit.res), 2)}</span></h4><div class="chart-box short"><canvas id="an-res" aria-label="Histograma de residuos"></canvas></div></div>
          <div class="callout info">${U.icon('alert', 16)}<div>Los VIF cercanos a 1 indican que no hay multicolinealidad. Los residuos deberían centrarse en cero y repartirse sin patrón: es estadística descriptiva aplicada al error del modelo. Los betas estandarizados permiten comparar el peso de variables con escalas distintas.</div></div>
        </div></div>

      <h2 class="an-sec"><span>4</span> Aprendizaje automático: red neuronal contra línea base</h2>
      <div class="card"><p class="muted small an-top">Partición 70 % entrenamiento (${D.trn.length}) y 30 % prueba (${D.tst.length}). El escalado usa sólo la media y el desvío del entrenamiento: ${VARS.map(([, l], j) => `${l.split(' (')[0]} ${U.num(D.mx[j], 1)} ± ${U.num(D.sx[j], 1)}`).join(' · ')}. Calcularlos con todos los datos filtraría información de la prueba.</p>
        <div class="an-sel">
          <label class="field"><span>Neuronas ocultas</span><select id="nn-h">${[4, 8, 16].map(v => `<option ${v === nn.h ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="field"><span>Épocas</span><select id="nn-ep">${[300, 800, 1500].map(v => `<option ${v === nn.ep ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="field"><span>Tasa de aprendizaje</span><select id="nn-lr">${[0.02, 0.05, 0.1].map(v => `<option value="${v}" ${v === nn.lr ? 'selected' : ''}>${U.num(v, 2)}</option>`).join('')}</select></label>
          <button class="btn btn-primary" id="nn-train">${U.icon('play', 15)} ${nn.res ? 'Volver a entrenar' : 'Entrenar red neuronal'}</button>
        </div>
        <div class="grid-2 an-res">
          <div>${nn.res ? `<h4>Curva de aprendizaje <span class="muted small">error cuadrático medio (escala estandarizada)</span></h4><div class="chart-box short"><canvas id="an-loss" aria-label="Curva de aprendizaje"></canvas></div>`
            : `<div class="an-empty">${U.icon('chart', 28)}<p>Entrená la red para ver la curva de aprendizaje y comparar su error con la regresión y la línea base.</p></div>`}</div>
          <div><div class="table-wrap"><table class="table"><thead><tr><th>Modelo</th><th class="num">RMSE</th><th class="num">MAE</th><th class="num">R²</th></tr></thead>
            <tbody>${modelos.map(([n, m]) => `<tr class="${n === mejor[0] ? 'an-sig' : ''}"><td>${n}</td><td class="num">${U.num(m.rmse, 3)}</td><td class="num">${U.num(m.mae, 3)}</td><td class="num">${U.num(m.r2, 3)}</td></tr>`).join('')}</tbody></table></div>
            <p class="muted small">Métricas sobre el 30 % de prueba, que el modelo no vio al entrenar.</p>
            <div class="callout ${mejor[1].rmse < base.rmse ? 'ok' : 'warn'}">${U.icon('check', 16)}<div>Menor error en prueba: <b>${mejor[0]}</b>${mejor[1].rmse < base.rmse ? `, que mejora la línea base un ${U.pct(1 - mejor[1].rmse / base.rmse, 0)} en RMSE` : ', sin mejorar la línea base'}. Un modelo sólo aporta si le gana a predecir siempre el promedio.</div></div></div>
        </div></div>

      <h2 class="an-sec"><span>5</span> Uso práctico: priorizar relevamientos</h2>
      <div class="card"><div class="card-head"><h3>Tramos sin relevar ordenados por exceso previsto</h3><span class="muted small">Estimado con la regresión sobre los tramos relevados</span></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Tramo</th><th>Calle</th><th>Zona</th><th>Proveedores</th><th class="num">Antigüedad</th><th class="num">Densidad</th><th class="num">Exceso previsto</th><th>Prioridad</th><th></th></tr></thead>
          <tbody>${sinRel.map(({ t, q, p }) => { const [pl, pc] = prio(p); return `<tr><td class="nowrap"><b>${t.id}</b></td><td>${U.esc(t.calle)} ${U.esc(t.altura || '')}</td><td>${U.esc(Store.zona(t.zona).nombre)}</td><td>${t.ocupaciones.map(o => U.esc(Store.prov(o.prov).corto)).join(', ')}</td><td class="num nowrap">${q.antiguedad} ${q.antiguedad === 1 ? 'año' : 'años'}</td><td class="num">${q.densidad}</td><td class="num"><b>${U.num(p, 1)}</b></td><td><span class="badge ${pc}">${pl}</span></td><td class="nowrap"><a class="btn btn-sm" href="#/relevamiento?tramo=${t.id}">${U.icon('camera', 14)} Relevar</a></td></tr>`; }).join('') || '<tr><td colspan="9" class="muted">Todos los tramos ya fueron relevados.</td></tr>'}</tbody>
        </table></div>
        <p class="muted small">Sirve para decidir el orden de inspección, no para sancionar: toda sanción requiere el relevamiento y la validación del inspector.</p></div>`;

    barras('an-hist', ['0', '1', '2', '3', '4', '5', '6', '7+'], hist, '#2a78d6', 'Cables de más');
    barras('an-res', ['≤ −3', '−3 a −2', '−2 a −1', '−1 a 0', '0 a 1', '1 a 2', '2 a 3', '3 a 4', '≥ 4'], rc, '#eb6834', 'Residuo');
    if (nn.res && window.Chart) {
      charts.push(new Chart(root.querySelector('#an-loss'), {
        type: 'line',
        data: { labels: nn.res.hist.ep, datasets: [
          { label: 'Entrenamiento', data: nn.res.hist.tr, borderColor: '#2a78d6', borderWidth: 2, pointRadius: 0, tension: 0.2 },
          { label: 'Prueba', data: nn.res.hist.te, borderColor: '#eb6834', borderWidth: 2, pointRadius: 0, tension: 0.2 },
        ] },
        options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { title: c => `Época ${c[0].label}`, label: c => `${c.dataset.label}: ${U.num(c.parsed.y, 3)}` } } },
          scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, grid: GRID, border: { display: false } } } },
      }));
    }

    root.querySelector('#an-a').onchange = e => { cmp.a = e.target.value; if (cmp.b === cmp.a) cmp.b = null; render(root); };
    root.querySelector('#an-b').onchange = e => { cmp.b = e.target.value; render(root); };
    ['h', 'ep', 'lr'].forEach(k => { root.querySelector('#nn-' + k).onchange = e => { nn[k] = +e.target.value; }; });
    root.querySelector('#nn-train').onclick = e => {
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = 'Entrenando…';
      setTimeout(() => {                                     // deja pintar el estado antes del cálculo
        nn.res = entrenarRed(datos(), nn.h, nn.ep, nn.lr);
        render(root);
        U.toast(`Red entrenada: RMSE en prueba ${U.num(nn.res.m.rmse, 2)} cables.`, 'ok');
      }, 30);
    };
  }

  return { render, destroy, refresh: () => root && root.isConnected && render(root) };
})();

</script>
  <!-- Demo guiada y arranque -->
  <script>/* js/tour.js */
/*
 * MODO DEMO GUIADA
 * Recorre automáticamente el ciclo completo en 5 pasos (≈4-5 minutos):
 *   1. Dashboard  2. Mapa  3. Relevamiento IA  4. Cobro y expediente
 *   5. Intimación, regularización del proveedor y mejora del indicador.
 * Cada "beat" navega, ejecuta acciones reales sobre el Store (las mismas
 * que haría un usuario) y muestra un tooltip sobre el elemento destacado.
 * Se puede pausar, adelantar o salir en cualquier momento.
 */
const Tour = (() => {
  const FEAT = () => Store.CFG.casoDestacado.tramoId;
  const PASOS = ['El problema', 'Mapa', 'Relevamiento', 'Cobro y expediente', 'Intimación y regularización'];
  let running = false, paused = false, skip = false, idx = 0;
  let el = null, spot = null, posTimer = null, target = null, inicio = null, expId = null;

  const go = async hash => { if (location.hash !== hash) { location.hash = hash; await U.sleep(650); } };
  const kp = () => Store.kpis();

  // ---------------- Guion ----------------
  const BEATS = [
    { paso: 0, ruta: '#/dashboard', target: '#dash-hero', dur: 12000, titulo: 'El municipio cobra menos de lo que está instalado',
      texto: () => { const k = kp(); return `El municipio cobra por <b>${U.num(k.autRel)} cables</b>, pero en la calle hay <b>${U.num(k.detRel)}</b>. Son <b>${U.num(k.exceso)} cables de más (+${U.pct(k.pctExceso, 1)})</b> que usan postes y ductos públicos sin pagar.`; } },
    { paso: 0, target: '#kpi-recaudacion', dur: 9000, titulo: 'Plata que se pierde todos los meses',
      texto: () => { const k = kp(); return `Hoy se recaudan <b>${U.money(k.regularMes)}</b> por mes. Si se cobrara todo lo instalado serían <b>${U.money(k.potencialMes)}</b>: una diferencia de <b>${U.money(k.brechaMes)}</b> por mes, todos los meses.`; } },
    { paso: 0, target: '#kpi-recuperar', dur: 9000, titulo: 'Deuda acumulada a recuperar',
      texto: () => { const k = kp(); return `Además se pueden reclamar <b>${U.moneyShort(k.aRecuperar)}</b>: el cobro retroactivo desde que se instaló cada cable de más, intereses por mora y multas.`; } },
    { paso: 0, target: '#dash-ranking', dur: 8000, titulo: '¿Quién incumple más?',
      texto: () => { const r = Store.ranking()[0]; return `El ranking muestra el nivel de incumplimiento de cada proveedor. <b>${U.esc(r.corto)}</b> encabeza la lista, con <b>${U.pct(r.pct, 1)}</b> de cables sin permiso.`; } },

    { paso: 1, ruta: '#/mapa', target: '#map', dur: 9000, titulo: 'Todos los tramos en el mapa',
      texto: 'Cada línea es una cuadra de postes o ductos. <b style="color:#0ca30c">Verde</b>: cumple · <b style="color:#b07d00">amarillo</b>: exceso leve · <b style="color:#d03b3b">rojo</b>: exceso crítico · gris: todavía sin relevar.' },
    { paso: 1, target: '#map-detail', dur: 12000, titulo: 'Un caso concreto',
      accion: async () => { MapaView.focus(FEAT()); await U.sleep(1800); },
      texto: () => { const t = Store.tramo(FEAT()), m = Store.metrics(t), p = Store.prov(t.ocupaciones[0].prov); return `Tramo <b>${t.id} — ${U.esc(t.calle)} ${t.altura}</b>: ${U.esc(p.corto)} tiene permiso para <b>${m.aut} cables</b>, pero la cámara del relevamiento detectó <b>${m.det}</b>. El doble.`; } },

    { paso: 2, ruta: () => `#/relevamiento?tramo=${FEAT()}`, target: '#rel-stage', dur: 6500, titulo: 'El inspector releva el poste',
      accion: async () => { Store.setRole('inspector'); RelevamientoView.load(FEAT()); await U.sleep(400); RelevamientoView.cargarMuestra(); },
      texto: 'Con la tablet municipal el inspector toma una foto del poste. Queda registrada automáticamente con <b>GPS, fecha y hora</b>. (La sesión cambió al rol <b>Inspector</b>).' },
    { paso: 2, target: '#rel-stage', dur: 5500, titulo: 'Visión por computadora',
      accion: async () => { await RelevamientoView.runDetection(); },
      texto: 'El modelo de visión artificial encuadra cada cable, los cuenta y calcula su <b>nivel de confianza</b>. Así no hace falta contar a ojo poste por poste.' },
    { paso: 2, target: '#rel-validacion', dur: 9000, titulo: 'Validación humana y evidencia',
      accion: async () => { await U.sleep(2500); RelevamientoView.confirm(); },
      texto: 'El inspector confirma el conteo. Se genera una <b>evidencia inalterable</b> (foto, coordenadas, fecha, hora y huella digital) y el expediente pasa a <b>Validación</b>.' },

    { paso: 3, ruta: null, target: '#cobro-detalle', dur: 12000, titulo: 'Cálculo automático del cobro',
      accion: async () => { Store.setRole('hacienda'); expId = Store.expedienteDestacado().id; CobroView.resetEsc(); await go(`#/cobro?exp=${expId}`); },
      texto: () => { const e = Store.exp(expId), l = Store.liquidacion(e); return `El sistema calcula solo: <b>${U.money(l.retro)}</b> de cobro retroactivo por ${l.meses} meses, <b>${U.money(l.interes)}</b> de intereses y <b>${U.money(l.multa)}</b> de multa. Total a recuperar: <b>${U.money(l.total)}</b>.`; } },
    { paso: 3, target: '#cobro-params', dur: 8000, titulo: 'Simulador "what-if"',
      accion: async () => { for (let v = 110; v <= 200; v += 10) { CobroView.setEsc('recargoExceso', v); await U.sleep(140); } },
      texto: 'Hacienda puede probar escenarios: si el recargo por exceso sube de 100 % a 200 %, todos los montos se recalculan al instante, sin tocar la tarifa vigente.' },
    { paso: 3, ruta: null, target: '.modal', dur: 9000, titulo: 'El expediente reúne todo',
      accion: async () => { CobroView.resetEsc(); await go(`#/expedientes?id=${expId}`); await U.sleep(300); },
      texto: 'Evidencia, liquidación, historial y próximas acciones en un solo lugar, con <b>semáforo de plazos</b>. Nadie tiene que armar carpetas a mano.' },

    { paso: 4, target: '.modal .doc', dur: 10000, titulo: 'Intimación en un clic',
      accion: async () => { Store.setRole('legal'); await U.sleep(300); ExpedientesView.previewIntimacion(expId); await U.sleep(400); },
      texto: 'Legales genera la <b>cédula de intimación</b> con los datos del tramo, la foto, la evidencia y el monto, lista para imprimir o firmar digitalmente.' },
    { paso: 4, target: '.modal .stepper', dur: 8000, titulo: 'Notificado: empieza a correr el plazo',
      accion: async () => { U.closeModals(); ExpedientesView.emitir(expId); ExpedientesView.openDetail(expId); await U.sleep(300); },
      texto: () => `Intimación emitida y notificada. El proveedor tiene <b>30 días (hasta el ${U.fmtDate(Store.exp(expId).vence)})</b> para regularizar; si no, multa y retiro de cables a su costo.` },
    { paso: 4, target: '#portal-dj', dur: 10000, titulo: 'El proveedor regulariza desde su portal',
      accion: async () => {
        U.closeModals();
        await go('#/portal');
        PortalView.login(Store.tramo(FEAT()).ocupaciones[0].prov);
        await U.sleep(300);
        PortalView.setTab('dj');
        await U.sleep(900);
        PortalView.fillDJ(FEAT(), Store.ocup(Store.tramo(FEAT()), Store.tramo(FEAT()).ocupaciones[0].prov).detectados);
      },
      texto: () => `Del otro lado, ${U.esc(Store.prov(Store.state.session.provId)?.corto || 'el proveedor')} entra a su portal y declara bajo juramento los <b>${Store.metrics(Store.tramo(FEAT())).det} cables</b> que tiene instalados. Con el régimen de regularización voluntaria, <b>no paga multa</b>.` },
    { paso: 4, target: '#portal-deudas', dur: 9000, titulo: 'Paga y queda en regla',
      accion: async () => {
        PortalView.submitDJ(true);
        await U.sleep(2200);
        U.closeModals();
        PortalView.setTab('deudas');
        await U.sleep(600);
        const m = PortalView.openBoleta(expId);
        await U.sleep(2600);
        PortalView.pagar(expId, m);
        await U.sleep(400);
      },
      texto: () => { const e = Store.exp(expId); return `Genera la boleta y paga <b>${U.money(e.montoCobrado || Store.liquidacion(e).total)}</b>. El expediente se cierra y los cables quedan <b>autorizados y facturados todos los meses</b>.`; } },
    { paso: 4, ruta: null, target: '#dash-hero', dur: 14000, titulo: 'El indicador mejora',
      accion: async () => { Store.logout(); await go('#/dashboard'); },
      texto: () => {
        const k = kp();
        return `El tramo ${FEAT()} ya figura en <b style="color:#0ca30c">verde</b>. Exceso: de <b>${inicio.exceso}</b> a <b>${k.exceso}</b> cables · recaudación mensual: de <b>${U.money(inicio.regularMes)}</b> a <b>${U.money(k.regularMes)}</b> · recuperado este mes: <b>+${U.money(k.recuperadoMes - inicio.recuperadoMes)}</b>. Multiplicado por todos los tramos en rojo y amarillo, ese es el potencial del sistema.`;
      } },
  ];

  // ---------------- Motor ----------------
  async function wait(ms) {
    let t = 0;
    while (t < ms) {
      if (!running) throw new Error('stop');
      if (skip) { skip = false; return; }
      await U.sleep(100);
      if (!paused) { t += 100; setProgress(t / ms); }
    }
  }

  function ensureUI() {
    const root = document.getElementById('tour-root');
    root.innerHTML = `<div class="tour-spot" hidden></div>
      <div class="tour-box" role="dialog" aria-live="polite">
        <div class="tour-top"><span class="tour-step"></span><button class="icon-btn" data-t="exit" aria-label="Salir de la demo">${U.icon('x', 16)}</button></div>
        <div class="tour-dots">${PASOS.map((p, i) => `<span data-i="${i}" title="${p}"></span>`).join('')}</div>
        <h4 class="tour-title"></h4>
        <p class="tour-text"></p>
        <div class="tour-progress"><div></div></div>
        <div class="tour-ctrl">
          <button class="btn btn-sm" data-t="pause">${U.icon('pause', 14)} Pausa</button>
          <button class="btn btn-sm btn-primary" data-t="next">Siguiente ${U.icon('next', 14)}</button>
        </div>
      </div>`;
    el = root.querySelector('.tour-box');
    spot = root.querySelector('.tour-spot');
    el.querySelector('[data-t=exit]').onclick = stop;
    el.querySelector('[data-t=next]').onclick = () => { skip = true; };
    el.querySelector('[data-t=pause]').onclick = e => {
      paused = !paused;
      e.currentTarget.innerHTML = paused ? `${U.icon('play', 14)} Continuar` : `${U.icon('pause', 14)} Pausa`;
    };
  }

  function setProgress(f) { const b = el && el.querySelector('.tour-progress div'); if (b) b.style.width = `${Math.min(100, f * 100)}%`; }

  function position() {
    if (!el) return;
    const t = target && document.querySelector(target);
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = Math.min(380, vw - 24);
    el.style.width = bw + 'px';
    const bh = el.offsetHeight;
    if (!t) {
      spot.hidden = true;
      el.style.left = (vw - bw) / 2 + 'px'; el.style.top = Math.max(12, vh - bh - 24) + 'px';
      return;
    }
    const r = t.getBoundingClientRect();
    spot.hidden = false;
    const pad = 6;
    Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    // Ubicación del cuadro: debajo, arriba, a la derecha o fijo abajo
    let left = U.clamp(r.left, 12, vw - bw - 12), top;
    if (r.bottom + bh + 16 < vh) top = r.bottom + 14;
    else if (r.top - bh - 16 > 0) top = r.top - bh - 14;
    else if (r.right + bw + 20 < vw) { left = r.right + 14; top = U.clamp(r.top, 12, vh - bh - 12); }
    else if (r.left - bw - 20 > 0) { left = r.left - bw - 14; top = U.clamp(r.top, 12, vh - bh - 12); }
    else top = vh - bh - 16;
    el.style.left = left + 'px'; el.style.top = top + 'px';
  }

  async function showBeat(b) {
    target = b.target;
    const txt = typeof b.texto === 'function' ? b.texto() : b.texto;
    el.querySelector('.tour-step').textContent = `Paso ${b.paso + 1} de 5 · ${PASOS[b.paso]}`;
    el.querySelectorAll('.tour-dots span').forEach((d, i) => { d.className = i < b.paso ? 'done' : i === b.paso ? 'on' : ''; });
    el.querySelector('.tour-title').textContent = b.titulo;
    el.querySelector('.tour-text').innerHTML = txt;
    setProgress(0);
    const t = target && document.querySelector(target);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
    await U.sleep(350);
    position();
  }

  async function start() {
    if (running) return;
    running = true; paused = false; skip = false; idx = 0;
    U.closeModals();
    Store.reset();                     // la demo siempre arranca desde el mismo estado
    Store.setRole('admin');
    inicio = Store.kpis();
    expId = Store.expedienteDestacado().id;
    ensureUI();
    document.body.classList.add('touring');
    posTimer = setInterval(position, 250);
    window.addEventListener('resize', position);
    try {
      for (idx = 0; idx < BEATS.length; idx++) {
        const b = BEATS[idx];
        if (b.ruta) await go(typeof b.ruta === 'function' ? b.ruta() : b.ruta);
        target = b.target;
        // El texto se muestra antes de la acción (si ya existe el destino) y se actualiza después
        el.querySelector('.tour-text').innerHTML = '';
        await showBeat(b);
        if (b.accion) { await b.accion(); if (!running) break; await showBeat(b); }
        await wait(b.dur);
      }
      if (running) fin();
    } catch (e) {
      if (e.message !== 'stop') { console.error(e); U.toast('La demo guiada se interrumpió: ' + e.message, 'error'); stop(); }
    }
  }

  function fin() {
    target = null;
    spot.hidden = true;
    el.querySelector('.tour-step').textContent = 'Demo completa';
    el.querySelectorAll('.tour-dots span').forEach(d => d.className = 'done');
    el.querySelector('.tour-title').textContent = 'Detectar → validar → calcular → intimar → regularizar';
    el.querySelector('.tour-text').innerHTML = 'Ese es el ciclo completo. Puede seguir explorando libremente cada módulo desde el menú lateral, o volver a ver la demo.';
    el.querySelector('.tour-progress div').style.width = '100%';
    el.querySelector('.tour-ctrl').innerHTML = `<button class="btn btn-sm" data-t="again">${U.icon('play', 14)} Ver de nuevo</button><button class="btn btn-sm btn-primary" data-t="close">Explorar la demo</button>`;
    el.querySelector('[data-t=again]').onclick = () => { stop(); setTimeout(start, 100); };
    el.querySelector('[data-t=close]').onclick = stop;
    position();
  }

  function stop() {
    running = false;
    clearInterval(posTimer);
    window.removeEventListener('resize', position);
    document.getElementById('tour-root').innerHTML = '';
    document.body.classList.remove('touring');
    el = spot = null;
  }

  return { start, stop, get running() { return running; } };
})();

</script>
  <script>/* js/app.js */
/*
 * ARRANQUE Y NAVEGACIÓN
 * Router por hash (#/mapa?tramo=T-0042), barra lateral, selector de rol
 * y re-render de la pantalla activa cada vez que cambia el Store.
 */
const App = (() => {
  const ROUTES = [
    { id: 'dashboard', label: 'Tablero ejecutivo', icon: 'dashboard', view: DashboardView },
    { id: 'mapa', label: 'Mapa GIS', icon: 'map', view: MapaView },
    { id: 'relevamiento', label: 'Relevamiento IA', icon: 'camera', view: RelevamientoView },
    { id: 'identificacion', label: 'Identificación de cables', icon: 'tag', view: IdentificacionView },
    { id: 'cobro', label: 'Motor de cobro', icon: 'calc', view: CobroView },
    { id: 'expedientes', label: 'Expedientes y sanciones', icon: 'folder', view: ExpedientesView },
    { id: 'portal', label: 'Portal del proveedor', icon: 'building', view: PortalView },
    { id: 'auditoria', label: 'Auditoría y roles', icon: 'shield', view: AuditoriaView },
    { id: 'planificacion', label: 'Planificación', icon: 'layers', view: PlanificacionView },
    { id: 'analitica', label: 'Analítica y modelos', icon: 'chart', view: AnaliticaView },
  ];
  let current = null;
  const viewEl = () => document.getElementById('view');

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    return { id: path || 'dashboard', params: Object.fromEntries(new URLSearchParams(qs || '')) };
  }

  function route() {
    const { id, params } = parseHash();
    // Un proveedor sólo puede ver su portal
    if (Store.state.session.role === 'proveedor' && id !== 'portal') { location.hash = '#/portal'; return; }
    const r = ROUTES.find(x => x.id === id) || ROUTES[0];
    if (current && current.view.destroy) current.view.destroy();
    current = r;
    renderChrome();
    window.scrollTo(0, 0);
    r.view.render(viewEl(), params);
    document.title = `${r.label} · Control de Cableado`;
    document.body.classList.remove('nav-open');
  }

  function renderChrome() {
    const S = Store.state, k = Store.kpis();
    const esProv = S.session.role === 'proveedor';
    document.getElementById('nav').innerHTML = ROUTES.filter(r => !esProv || r.id === 'portal').map(r => {
      const badge = r.id === 'expedientes' && k.vencidos ? `<span class="nav-badge" title="Expedientes con plazo vencido">${k.vencidos}</span>`
        : r.id === 'identificacion' && k.sinId ? `<span class="nav-badge warn" title="Cables sin identificar">${k.sinId}</span>` : '';
      return `<a href="#/${r.id}" class="${current && current.id === r.id ? 'active' : ''}">${U.icon(r.icon, 18)}<span>${r.label}</span>${badge}</a>`;
    }).join('');
    const sel = document.getElementById('role-select');
    sel.innerHTML = Object.entries(Store.ROLES).map(([key, r]) => `<option value="${key}" ${S.session.role === key ? 'selected' : ''}>${r.nombre}</option>`).join('');
    document.getElementById('user-chip').innerHTML = `${U.icon('user', 16)}<span>${U.esc(Store.usuarioActual())}</span>`;
    document.getElementById('topbar-title').textContent = current ? current.label : '';
  }

  function onStore() {
    renderChrome();
    if (!current) return;
    // Si el rol cambió a/desde proveedor, puede corresponder otra pantalla
    if (Store.state.session.role === 'proveedor' && current.id !== 'portal') { location.hash = '#/portal'; return; }
    const v = current.view;
    if (v.refresh) v.refresh(); else v.render(viewEl(), parseHash().params);
  }

  function init() {
    Store.init();
    document.getElementById('brand-muni').textContent = Store.CFG.municipio.nombre;
    Store.subscribe(onStore);
    window.addEventListener('hashchange', route);

    document.getElementById('role-select').onchange = e => {
      const role = e.target.value;
      Store.setRole(role);
      if (role === 'proveedor') location.hash = '#/portal';
      else if (current && current.id === 'portal') location.hash = '#/dashboard';
      U.toast(`Ahora opera como: ${Store.ROLES[role].nombre}${role === 'proveedor' ? ' (elija la empresa para ingresar)' : ''}`);
    };
    document.getElementById('btn-tour').onclick = () => Tour.start();
    document.getElementById('btn-reset').onclick = () => {
      if (Tour.running) Tour.stop();
      U.closeModals();
      Store.reset();
      location.hash = '#/dashboard';
      U.toast('Datos de la demo reiniciados.', 'ok');
    };
    document.getElementById('btn-menu').onclick = () => document.body.classList.toggle('nav-open');
    document.getElementById('sidebar-scrim').onclick = () => document.body.classList.remove('nav-open');
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !Tour.running) { const m = document.querySelectorAll('#modal-root .modal-backdrop'); if (m.length) m[m.length - 1].querySelector('[data-close]').click(); } });

    route();
  }

  return { init, route };
})();

document.addEventListener('DOMContentLoaded', App.init);

</script>
