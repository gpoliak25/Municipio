<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Ocupación de Cableado · Demo</title>
  <!-- Librerías gratuitas por CDN: Leaflet (mapa OSM) y Chart.js (gráficos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4M19 21V4M3 6h4M17 6h4M5 8c4 5 10 5 14 0M5 12c4 4 10 4 14 0"/></svg>
        </div>
        <div>
          <div class="brand-title">Control de Cableado</div>
          <div class="brand-sub" id="brand-muni"></div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost-dark btn-sm" id="btn-reset" title="Vuelve los datos al estado inicial">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          Reiniciar datos de la demo
        </button>
        <div class="foot-note">Demo con datos simulados · v1.0</div>
      </div>
    </aside>
    <div id="sidebar-scrim"></div>

    <div id="main">
      <header id="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-right">
          <label class="role-select">
            <span>Rol</span>
            <select id="role-select" aria-label="Rol del usuario"></select>
          </label>
          <div class="user-chip" id="user-chip"></div>
          <button class="btn btn-accent" id="btn-tour">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
            Demo guiada
          </button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="tour-root"></div>
  <div id="print-area"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Datos de configuración (JSON) -->
  <script src="data/mock-data.js"></script>
  <!-- Opcional: cuadras reales de OSM (tools/generar-geometria.js). Sin este archivo se usa una grilla sintética -->
  <script src="data/geo-tramos.js"></script>
  <!-- Núcleo -->
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <!-- Pantallas -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/mapa.js"></script>
  <script src="js/views/relevamiento.js"></script>
  <script src="js/views/identificacion.js"></script>
  <script src="js/views/cobro.js"></script>
  <script src="js/views/expedientes.js"></script>
  <script src="js/views/portal.js"></script>
  <script src="js/views/auditoria.js"></script>
  <script src="js/views/planificacion.js"></script>
  <script src="js/views/analitica.js"></script>
  <!-- Demo guiada y arranque -->
  <script src="js/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
